# Licences, bans, sources and advisories for the umbrella workspace (raul-core, raul-cli and the nvmod and
# loot-rs crates they link). Started from nvmod-rs deny.toml; GPL Components are publish = false and so private.
# cargo-deny configuration. Run with `task deny` (also against fuzz/Cargo.toml).
# The project is GPL-3.0-only (the same as loot-rs, which it will link); every third-party licence allowed below
# is compatible with it. Nothing is "allowed by default": a licence not listed is refused.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Add RUSTSEC ids here only with a comment saying why the advisory does not apply.
ignore = [
    # zvariant, zbus_names and zvariant_derive were merged into zbus 6; keyring's Secret Service store (zbus 5, pure
    # Rust, no libdbus) still uses the standalone crates. Unmaintained notices, not vulnerabilities; drop these when
    # the keyring stores move to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # The linked nv-rs engine crates declare GPL-3.0-or-later and are not publish = false, so they are not private.
    # scripts/check-gpl-scope.sh (run in ci and gui workflows) fails when that id appears outside components/nv-rs.
    "GPL-3.0-or-later",
    # A dependency of the engine's tree (also allowed by nv-rs's own deny.toml).
    "BSL-1.0",
    # ttwright-core links these: ba2 (0BSD), symphonia and option-ext (MPL-2.0, file-level copyleft, used unmodified),
    # and the LAME encoder bindings mp3lame-sys and mp3lame-encoder (LGPL-3.0, written with the deprecated id the crates use, which the GPL-3.0 Toolbox may link).
    "0BSD",
    "MPL-2.0",
    "LGPL-3.0",
]
confidence-threshold = 0.8
# esplugin (GPL-3.0) reaches the workspace only through lodwright-testkit, a dev-dependency of tests, so it is never
# linked into the shipped `raul`. The Toolbox is GPL-3.0-only, so the licence is compatible anyway.
# libbz2-rs-sys is the pure-Rust port of bzip2 (no C), under the bzip2-1.0.6 licence: a short permissive BSD-style
# licence that asks for the notice to be kept and no more. It is reached only through the `bzip2` crate, which nvmod
# links to read 7z BZip2 blocks and tar.bz2 archives in process.
exceptions = [
    { allow = ["GPL-3.0"], crate = "esplugin" },
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
]

# The workspace crates are publish = false; their own licence is checked by the SPDX guard instead.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# loot-rs is linked as a library, pinned to a release tag (see Cargo.toml and ADR-0002).
allow-git = ["https://github.com/JorisJonkers-dev/loot-rs"]
