# Licences, bans, sources and advisories for the umbrella workspace (raul-core, raul-cli and the nvmod and
# loot-rs crates they link). Started from nvmod-rs deny.toml; GPL Components are publish = false and so private.
# cargo-deny configuration. Run with `task deny` (also against fuzz/Cargo.toml).
# The project is GPL-3.0-only (the same as loot-rs, which it will link); every third-party licence allowed below
# is compatible with it. Nothing is "allowed by default": a licence not listed is refused.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Add RUSTSEC ids here only with a comment saying why the advisory does not apply.
ignore = [
    # chrono is flagged as unmaintained with no safe upgrade. It comes in through ttwright-core, which reads dates
    # with it; it is no vulnerability. Remove this entry when ttwright-core moves to jiff or time.
    "RUSTSEC-2026-0543",
]
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # ttwright-core links these: ba2 (0BSD), symphonia and option-ext (MPL-2.0, file-level copyleft, used unmodified),
    # and the LAME encoder bindings mp3lame-sys and mp3lame-encoder (LGPL-3.0, written with the deprecated id the crates use, which the GPL-3.0 Toolbox may link).
    "0BSD",
    "MPL-2.0",
    "LGPL-3.0",
]
confidence-threshold = 0.8
exceptions = []

# The workspace crates are publish = false; their own licence is checked by the SPDX guard instead.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# loot-rs is linked as a library, pinned to a release tag (see Cargo.toml and ADR-0003 of nv-linux).
allow-git = ["https://github.com/JorisJonkers-dev/loot-rs"]
