<!doctype html>

<!-- Raul's Trusty Toolbox: GUI mockup. Information architecture:
     Play group (Home, Mods incl. TTW, Load order, LOD) and System group (Versions, Doctor, Settings).
     One continuous dark surface, hairline separators, hand-drawn Fallout-style line icons, notification chips.
     Self-contained: no network, no bundled fonts, no game or mod files. All data is invented.
     Deep links: #home #mods #order #lod #versions #doctor #prefs ; no hash = first-run setup. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raul's Trusty Toolbox</title>
<style>
:root{
  /* every text colour is at least 4.5:1 on --bg, --raise and --sel (checked) */
  --bg:#101215; --raise:#171A1F; --sel:#1F2530; --hover:#1A1D23;
  --line:#2F353F;          /* hairline separators */
  --ctl:#5C6570;           /* input and button borders, 3.2:1 */
  --text:#E6E8EB; --muted:#98A1AC;
  --accent:#3DD6C6; --on-accent:#101215;   /* primary actions, active nav, links */
  --brand:#F59E3B;         /* Raul's amber: logo, Raul's name, section ticks. Never a status. */
  --ok:#4CC38A; --warn:#F2A93B; --err:#F26B6B; --info:#6EA8FE;
  --ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --mono:ui-monospace,"JetBrains Mono","Cascadia Mono","DejaVu Sans Mono",monospace;
  --fs:14px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:400 var(--fs)/1.55 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-40px;z-index:20;background:var(--accent);color:var(--on-accent);padding:6px 10px;border-radius:6px}
.skip:focus{top:8px}
.mono,.ver{font-family:var(--mono);font-size:.92em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:auto 1fr auto;min-height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;height:52px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;margin:0;font-weight:650;font-size:.98rem;white-space:nowrap}
.brand .ico{color:var(--brand);width:20px;height:20px}
.brand small{color:var(--muted);font-weight:500}
.setup{display:flex;align-items:center;min-width:0;flex:1;gap:2px}
.setup button{display:flex;align-items:center;gap:7px;background:none;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--muted);min-width:0}
.setup button:hover{background:var(--hover);color:var(--text)}
.setup button .v{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.setup button .ico{width:16px;height:16px}
.setup button .k{font-size:.8rem}
.setup .sep{width:1px;height:18px;background:var(--line)}
.caret{width:12px!important;height:12px!important}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:none;color:var(--muted);cursor:pointer;min-width:190px}
.search:hover{border-color:var(--ctl);color:var(--text)}
.search kbd{margin-left:auto}
.side{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column}
.grp{margin:12px 10px 4px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grp:first-child{margin-top:2px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a[aria-current="page"]{background:var(--sel);color:var(--text);font-weight:550}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .chipn{margin-left:auto}
.side .ver-foot{margin-top:auto;padding:10px;color:var(--muted);font-size:.8rem}
main{padding:22px 32px 32px;min-width:0}
.foot{grid-column:1/-1;display:flex;gap:16px;align-items:center;padding:0 20px;height:32px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.foot .msg{color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--mono);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--text)}
/* ---------- notification chips ---------- */
.chipn{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;line-height:1;padding:3px 6px;border-radius:999px;font-variant-numeric:tabular-nums;background:color-mix(in srgb,currentColor 16%,transparent)}
.chipn .ico{width:12px;height:12px;stroke-width:2.2}
.ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)} .info{color:var(--info)} .mut{color:var(--muted)}
.alerts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px;padding:0;list-style:none}
.alerts button{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;padding:6px 12px;border-radius:999px;font-weight:550;background:color-mix(in srgb,currentColor 13%,transparent)}
.alerts button:hover{background:color-mix(in srgb,currentColor 22%,transparent)}
.alerts .ico{width:15px;height:15px;stroke-width:2}
.alerts .lbl{color:var(--text)}
/* ---------- page header ---------- */
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.ph .t{display:flex;align-items:center;gap:12px}
.ph .t>.ico{width:28px;height:28px;color:var(--brand);stroke-width:1.4}
.ph h1{margin:0;font-size:1.4rem;font-weight:650;letter-spacing:-.01em}
.ph p{margin:0;color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* retro callback 1 of 3: bracket-tick section labels */
.sec{display:flex;align-items:center;gap:10px;margin:28px 0 6px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec::before{content:"";width:9px;height:6px;border-left:2px solid var(--brand);border-top:2px solid var(--brand)}
.sec .more{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500}
.sec:first-child{margin-top:0}
/* ---------- controls ---------- */
.btn{border:1px solid var(--ctl);background:transparent;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.btn:hover{background:var(--sel)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#fff)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 55%,var(--ctl))}
.btn.sm{padding:3px 10px;font-size:.88rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.btn .ico{width:16px;height:16px}
input[type=text],input[type=search],select{background:var(--raise);border:1px solid var(--ctl);border-radius:6px;padding:6px 10px;min-width:0}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0;vertical-align:middle}
label.inl{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted)}
/* ---------- lists (hairlines, no boxes) ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:500;padding:8px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr.sel-able{cursor:pointer}
.tbl tbody tr.sel-able:hover td{background:var(--hover)}
.tbl tbody tr[aria-selected="true"] td{background:var(--sel)}
.tbl tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .act{text-align:right;white-space:nowrap}
.tbl .sub{display:block;color:var(--muted);font-size:.86rem}
.tbl .sub.err{color:var(--err)}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st .ico{width:15px;height:15px;stroke-width:2}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);align-items:start}
.split>.detail{border-left:1px solid var(--line);padding:4px 0 0 24px;margin-left:24px;position:sticky;top:12px}
.detail h2{margin:0 0 4px;font-size:1.12rem;font-weight:600}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:12px 0}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note .ico{width:16px;height:16px;margin-top:2px;stroke-width:2}
.note .d{display:block;color:var(--muted);font-size:.9rem}
.raul{display:flex;gap:10px;align-items:baseline;color:var(--muted);margin:0 0 4px}
.raul b{color:var(--brand);font-weight:600;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase}
.meter{height:6px;background:var(--sel);border-radius:3px;overflow:hidden;min-width:80px;flex:1}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s linear;border-radius:3px}
.reduce .meter i{transition:none}
.prog{display:flex;align-items:center;gap:10px}
.prog .pct{font-family:var(--mono);font-size:.85rem;color:var(--muted);min-width:3.5ch;text-align:right}
.empty{color:var(--muted);padding:20px;text-align:center}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:14px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.rows .ico.s{width:18px;height:18px;stroke-width:2}
.rows .what{flex:1;min-width:0}
.rows .st{min-width:104px}
.rows .rowact{min-width:86px;text-align:right}
.rows .what span{display:block;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px}
.home>.launch{border-left:1px solid var(--line);margin-left:28px;padding-left:28px}
.bigplay{width:100%;justify-content:center;padding:12px 18px;font-size:1.05rem;margin:14px 0 6px}
.why{font-size:.88rem;color:var(--err);display:flex;gap:6px;align-items:center}
/* TTW band on Mods */
.ttw{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ttw .ico.big{width:26px;height:26px;color:var(--brand);stroke-width:1.4}
.ttw .what{flex:1;min-width:220px}
.ttw .what span{display:block;color:var(--muted);font-size:.9rem}
.ttw .prog{min-width:220px;flex:1}
.pin td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
/* settings */
.form{display:grid;grid-template-columns:220px minmax(0,1fr)}
.form>div{padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.form .lbl{font-weight:550;padding-right:16px}
.form .lbl small{display:block;font-weight:400;color:var(--muted)}
.field{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field input[type=text]{flex:1;min-width:180px}
.field .st{min-width:92px}
.seg{display:inline-flex;border:1px solid var(--ctl);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--text);font-weight:550;box-shadow:inset 0 -2px 0 var(--accent)}
.tag{font-size:.75rem;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--sel);color:var(--muted);margin-left:8px;font-family:var(--ui)}
.mv-up{color:var(--ok);display:inline-flex;align-items:center;gap:4px} .mv-down{color:var(--warn);display:inline-flex;align-items:center;gap:4px}
/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(5,6,8,.72);display:none;align-items:flex-start;justify-content:center;padding:8vh 16px;z-index:10}
.scrim.open{display:flex}
.dlg{background:var(--raise);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);padding:20px 22px;max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dlg h2{margin:0 0 14px;font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:10px}
.dlg h2 .ico{color:var(--brand)}
.steps{display:flex;list-style:none;margin:0 0 18px;padding:0;gap:6px}
.steps li{flex:1;padding:6px 2px 8px;font-size:.86rem;color:var(--muted);border-bottom:2px solid var(--line);display:flex;gap:6px;align-items:center}
.steps li[aria-current="step"]{color:var(--text);font-weight:550;border-bottom-color:var(--accent)}
.steps li.done{color:var(--text);border-bottom-color:var(--ok)}
.steps li .ico{width:14px;height:14px;color:var(--ok);stroke-width:2.2}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.dlg .form{grid-template-columns:150px minmax(0,1fr)}
.pal input{width:100%;margin-bottom:8px;padding:9px 12px}
.pal ul{list-style:none;margin:0;padding:0}
.pal li{padding:7px 10px;border-radius:6px;cursor:pointer}
.pal li[aria-selected="true"]{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center}
pre.diff{font-family:var(--mono);font-size:.86rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow:auto;margin:8px 0}
/* wizard: same shell as the app (top bar, rail, content, foot bar) */
.wz{display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:auto 1fr auto;min-height:100vh}
.wz .top{gap:14px}
.wz .top .where{color:var(--muted);display:flex;align-items:center;gap:10px;min-width:0}
.wz .top .where b{color:var(--text);font-weight:550}
.wz .top .skip-w{margin-left:auto}
.wrail{border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:2px}
.wrail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.wrail li{position:relative;display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:6px;color:var(--muted)}
.wrail li .ico{margin-top:1px}
.wrail li .lbl{display:flex;flex-direction:column;min-width:0}
.wrail li .lbl small{font-size:.8rem;color:var(--muted)}
.wrail li .tick{margin-left:auto;margin-top:2px}
.wrail li.done{color:var(--text)}
.wrail li.done .tick{color:var(--ok)}
.wrail li[aria-current="step"]{background:var(--sel);color:var(--text);font-weight:550}
.wrail li[aria-current="step"]::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.wrail li[aria-current="step"] .ico:first-child{color:var(--brand)}
.wrail .hint{margin-top:auto;padding:10px;font-size:.8rem;color:var(--muted)}
.wmain{padding:28px 36px 32px;min-width:0;max-width:820px}
.wmain .card{border-top:1px solid var(--line);padding-top:18px;margin-top:4px}
.wmain .field{margin:4px 0 12px}
.wmain .field input[type=text]{flex:1;min-width:220px}
.wopt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 14px}
.wopt label{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--text)}
.wopt label:hover{border-color:var(--ctl)}
.wopt label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.wopt input{margin-top:3px}
.wopt small{display:block;color:var(--muted);font-size:.86rem}
.wfoot{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:10px 20px;border-top:1px solid var(--line)}
.wfoot .count{color:var(--muted);font-size:.86rem;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.wfoot .count .meter{max-width:180px}
.demo-tools{margin-top:22px;font-size:.84rem;color:var(--muted);display:flex;gap:6px;align-items:center}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .top{height:auto;flex-wrap:wrap;padding:8px 14px;gap:8px}
  .setup{order:3;flex-basis:100%;flex-wrap:wrap}
  .setup .sep,.search{display:none}
  .setup button .v{max-width:200px}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;flex-direction:row;flex-wrap:wrap}
  .grp,.side .ver-foot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav a{padding:6px 8px;gap:7px}
  .nav a[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:2px;border-radius:2px}
  .split,.home{grid-template-columns:minmax(0,1fr)}
  .split>.detail,.home>.launch{border-left:0;margin-left:0;padding-left:0;border-top:1px solid var(--line);margin-top:18px;padding-top:18px;position:static}
  .form,.dlg .form{grid-template-columns:minmax(0,1fr)}
  .form>div.lbl{border-bottom:0;padding-bottom:0}
  .hide-s{display:none}
  main{padding:16px 16px 24px}
  .wz{grid-template-columns:minmax(0,1fr)}
  .wz .top{height:auto;flex-wrap:wrap;padding:8px 16px}
  .wrail{border-right:0;border-bottom:1px solid var(--line);padding:8px 16px}
  .wrail ol{flex-direction:row;gap:4px}
  .wrail li{flex:1;padding:6px 4px;justify-content:center}
  .wrail li .lbl,.wrail li .tick,.wrail .hint{display:none}
  .wrail li[aria-current="step"]::before{left:6px;right:6px;top:auto;bottom:0;width:auto;height:2px;border-radius:2px}
  .wmain{padding:18px 16px 24px}
  .wopt{grid-template-columns:minmax(0,1fr)}
  .wfoot{padding:10px 16px;flex-wrap:wrap}
  .foot .k{display:none}
  .tbl td,.tbl th{padding:8px 8px}
  .tbl .act{white-space:normal;text-align:right}
  .tbl .act .btn{margin:2px 0}
  .tbl .ver{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
@media (forced-colors:active){.ico{stroke:CanvasText}.chipn,.alerts button{border:1px solid CanvasText}}
</style>
</head>

const ttwInstalled=()=>S.ttw.state==="installed";
function syncChecks(){
  const o=chk("order"),l=chk("lod"),t=chk("ttw");
  if(orderMoves()){o.st="warn";o.d=orderMoves()+" plugins out of place."}else{o.st="ok";o.d="Sorted. All masters load first."}
  if(lodOld()){l.st="warn";l.d=lodOld()+" of 6 blocks older than your mods."}else{l.st="ok";l.d="All 6 blocks current."}
  chk("eng").d="nv-rs "+S.cfg.engine+" active.";
  const c=chk("cfg");if(c.st==="ok")c.d="Points to nv-rs "+S.cfg.engine+".";
  if(ttwInstalled()){t.st="ok";t.d="Installed, "+S.ttw.ver+"."}
  else if(S.ttw.want&&!S.cfg.fo3){t.st="warn";t.d="Fallout 3 folder not set.";t.fix="Set up TTW"}
  else{t.st="ok";t.d="Not used.";delete t.fix}
}
/* one source for nav chips, Home chips and Doctor */
function alerts(){
  const a=[];
  if(chk("cfg").st==="err")a.push({k:"err",page:"doctor",n:1,t:"Engine config",i:"err"});
  if(chk("ttw").st==="warn")a.push({k:"warn",page:"mods",n:1,t:"TTW needs Fallout 3",i:"warn"});
  if(orderMoves())a.push({k:"warn",page:"order",n:orderMoves(),t:"Load order",i:"warn"});
  if(lodOld())a.push({k:"warn",page:"lod",n:lodOld(),t:"LOD out of date",i:"warn"});
  if(engineNew()+compUpd())a.push({k:"info",page:"versions",n:engineNew()+compUpd(),t:"Version updates",i:"new"});
  if(modUpd())a.push({k:"info",page:"mods",n:modUpd(),t:"Mod updates",i:"new"});
  return a;
}
/* ============ chrome ============ */
const GROUPS=[["Play",[["home","Home","vault"],["mods","Mods","crate"],["order","Load order","tape"],["lod","LOD","mojave"]]],
              ["System",[["versions","Versions","radio"],["doctor","Doctor","stim"],["prefs","Settings","tools"]]]];
const PG=GROUPS.flatMap(g=>g[1]);
function navChip(id){
  const chip=(k,i,n,label)=>`<span class="chipn ${k}">${ico(i)}<span aria-hidden="true">${n}</span><span class="sr">, ${label}</span></span>`;
  if(id==="mods"){const n=modUpd()+(chk("ttw").st==="warn"?1:0);if(n)return chip(chk("ttw").st==="warn"?"warn":"info",chk("ttw").st==="warn"?"warn":"new",n,n+" need attention")}
  if(id==="order"&&orderMoves())return chip("warn","warn",orderMoves(),orderMoves()+" to sort");
  if(id==="lod"&&lodOld())return chip("warn","warn",lodOld(),lodOld()+" out of date");
  if(id==="versions"&&engineNew()+compUpd())return chip("info","new",engineNew()+compUpd(),(engineNew()+compUpd())+" updates");
  if(id==="doctor"){const b=healthBad();if(b.length){const e=b.some(c=>c.st==="err");return chip(e?"err":"warn",e?"err":"warn",b.length,b.length+" problems")}}
  if(id==="prefs"&&S.ttw.want&&!S.cfg.fo3)return chip("warn","warn",1,"1 location not set");
  return "";
}
function chrome(){
  document.body.classList.toggle("reduce",S.cfg.reduce);

  $("#setup").innerHTML=`<button data-act="edit-game" title="${esc(S.cfg.game)}" aria-label="Change New Vegas folder, now ${esc(S.cfg.game)}">${ico("folder")}<span class="k hide-s">Game</span><span class="v mono">${esc(S.cfg.game)}</span></button><span class="sep" aria-hidden="true"></span>
   <button data-act="edit-engine" aria-label="Manage engine versions, now nv-rs ${esc(S.cfg.engine)}">${ico("chip")}<span class="k hide-s">Engine</span><span class="v mono">nv-rs ${esc(S.cfg.engine)}</span>${engineNew()?`<span class="chipn info">${ico("new")}<span class="sr">update available</span></span>`:""}${ico("down","caret")}</button><span class="sep" aria-hidden="true"></span>
   <button data-act="edit-profile" aria-label="Switch profile, now ${esc(S.cfg.profile)}">${ico("user")}<span class="k hide-s">Profile</span><span class="v">${esc(S.cfg.profile)}</span>${ico("down","caret")}</button>`;

/* ============ pages ============ */
const V={};

const header=(id,t,sub,tools)=>`<div class="ph"><div class="t">${ico(icoOf(id))}<div><h1 id="pgh" tabindex="-1">${t}</h1>${sub?`<p>${sub}</p>`:""}</div></div>${tools?`<div class="tools">${tools}</div>`:""}</div>`;

V.home=()=>{

   ["New Vegas","ok",S.cfg.game,""],

   (()=>{const need=S.ttw.want&&!S.cfg.fo3;return ["TTW",ttwInstalled()?"ok":need?"warn":"unset",ttwInstalled()?(S.ttw.on?"Installed · enabled":"Installed · off"):S.ttw.state==="installing"?"Installing · "+S.ttw.p+"%":need?"Fallout 3 folder not set":S.ttw.want?"Ready to install":"Not set up",ttwInstalled()||S.ttw.state==="installing"?"":`<button class="btn sm${S.ttw.want?" primary":""}" data-act="ttw-setup">${S.ttw.want&&!need?"Install":"Set up"}</button>`]})(),

 browse(el){const f=el.dataset.for&&document.getElementById(el.dataset.for);if(f){f.value=DEMO_PATH[f.id]||"D:\\Example\\Folder";f.focus();if(f.dataset.key)savePath(f);else if(D.kind==="ttw")D[f.id]=f.value}status("Folder picked (demo).")},
 setcfg(el){const k=el.dataset.k,v=el.dataset.v;S.cfg[k]=v==="true"?true:v==="false"?false:/^\d+$/.test(v)?+v:v;save();render()},
 toggle(el){const m=MODS.find(x=>x.id===+el.dataset.id);m.on=!m.on;status(`${m.name} ${m.on?"enabled":"disabled"}.`);render()},
 "ttw-toggle"(){S.ttw.on=!S.ttw.on;status("TTW "+(S.ttw.on?"enabled":"disabled")+".");render()},
 "ttw-setup"(){openTtw()},
 "ttw-remove"(){openConfirm("Remove TTW?","Deletes the TTW output folder (26 GB). Your Fallout 3 and New Vegas folders are not touched.","Remove",()=>{S.ttw.state="none";S.cfg.ttw="";S.selMod=1;status("TTW removed.");render("#pgh")})},
 remove(el){const i=MODS.findIndex(x=>x.id===+el.dataset.id);const m=MODS[i];openConfirm("Remove mod?",`${m.name} is uninstalled. A restore point is saved first, so Undo brings it back.`,"Remove",()=>{MODS.splice(i,1);status(`Removed ${m.name}.`);render("#pgh")})},
 "mod-upd"(el){const m=MODS.find(x=>x.id===+el.dataset.id);m.ver=m.upd;delete m.upd;status(`${m.name} updated to ${m.ver}.`);render()},
 install(){openInstall()},
 "order-sort"(){S.order="preview";render('[data-act="order-apply"]')},
 "order-cancel"(){S.order="idle";render('[data-act="order-sort"]')},
 "order-apply"(){S.orderPrev=ORDER.slice();ORDER=SORTED.slice();S.order="idle";status("Load order applied. Undo restores the old one.");render('[data-act="order-undo"]')},
 "order-undo"(){ORDER=S.orderPrev;S.orderPrev=null;S.order="idle";status("Previous order restored.");render('[data-act="order-sort"]')},
 "lod-run"(){runLod(LOD.map((b,i)=>b.old?i:-1).filter(i=>i>=0))},
 "lod-all"(){openConfirm("Rebuild all LOD?","All 6 blocks, about 20 minutes. Current blocks stay until each new one is done.","Rebuild",()=>runLod(LOD.map((b,i)=>i)))},
 "lod-stop"(){clearInterval(lodTimer);S.lodRun=false;LOD.forEach(b=>{if(b.p<100){b.p=0;b.old=true}});status("Stopped. Finished blocks kept.");render('[data-act="lod-run"]')},
 "eng-use"(el){const v=el.dataset.id;S.cfg.engine=v;const c=chk("cfg");if(c.st==="err"&&v==="0.13.0"){c.st="ok"}status("Now using nv-rs "+v+".");render()},
 "eng-get"(el){const b=BUILDS.find(x=>x.v===el.dataset.id);openConfirm("Install nv-rs "+b.v+"?",`${b.size} download. Your current build stays active until you press Activate.`,"Install",()=>{b.inst=true;status("nv-rs "+b.v+" installed. Press Activate to switch.");render(`[data-act="eng-use"][data-id="${b.v}"]`)})},
 "eng-rm"(el){const b=BUILDS.find(x=>x.v===el.dataset.id);openConfirm("Remove nv-rs "+b.v+"?","Frees "+b.size+". You can install it again later.","Remove",()=>{b.inst=false;status("Removed nv-rs "+b.v+".");render()})},
 "c-upd"(el){const c=COMPS.find(x=>x.id===el.dataset.id);if(c.st==="busy")return;c.st="busy";render();setTimeout(()=>{if(c.fail){c.fail=false;c.st="fail";status(c.name+": download damaged. Nothing changed.")}else{c.prev=c.have;c.have=c.latest;c.st="done";status(c.name+" updated to "+c.have+".")}render()},S.cfg.reduce?100:700)},
 "c-roll"(el){const c=COMPS.find(x=>x.id===el.dataset.id);const was=c.have;c.have=c.prev;c.prev=null;c.st=c.have===c.latest?"cur":"new";status(`${c.name} rolled back to ${c.have} (was ${was}).`);render()},
 "u-all"(){const l=latestStable();if(engineNew())l.inst=true;COMPS.filter(c=>c.st==="new").forEach(c=>A["c-upd"]({dataset:{id:c.id}}));status("Updating. nv-rs "+l.v+" installed; press Activate to switch.");render()},
 "u-check"(){status("Checked: "+(engineNew()+compUpd())+" version updates, "+modUpd()+" mod updates.")},
 fix(el){const id=el.dataset.id;if(id==="lod"){go("lod");return}if(id==="order"){go("order");A["order-sort"]();return}if(id==="ttw"){openTtw();return}
   const c=chk(id);c.st="ok";status("Fixed: engine config now points to nv-rs "+S.cfg.engine+".");render()},
 recheck(){status("Checks done: "+healthBad().length+" to look at.")},
 wizard(){S.wiz=1;S.w={game:"",found:null,ttw:false,fo3:"",eng:0,checked:0};render("#wGame")},
 "w-find"(){S.w.game=$("#wGame").value||DEMO_PATH.wGame;S.w.found="ok";render('[data-act="w-next"]')},
 "w-fo3"(){S.w.fo3=$("#wFo3").value||DEMO_PATH.wFo3;render('[data-act="w-next"]')},
 "w-miss"(){S.w.game="D:\\Example\\Empty";S.w.found="miss";render("#wGame")},
 "w-eng"(){const t=setInterval(()=>{S.w.eng=Math.min(100,S.w.eng+(S.cfg.reduce?50:10));setProg("wEngM",S.w.eng);if(S.w.eng>=100){clearInterval(t);render('[data-act="w-next"]')}},150);render("#wEngM")},
 "w-next"(){S.wiz++;if(S.wiz===4){S.w.checked=0;const t=setInterval(()=>{S.w.checked++;render('[data-act="w-next"]');if(S.w.checked>=CHECKS.length)clearInterval(t)},S.cfg.reduce?30:160)}render(S.wiz===2?(S.w.ttw?"#wTtw":"#wTtwNo"):S.wiz===3?'[data-act="w-eng"]':"#wzh")},
 "w-back"(){S.wiz--;render("#wzh")},
 "w-skip"(){S.wiz=0;go("home")},
 "w-finish"(){S.wiz=0;if(S.w.game)S.cfg.game=S.w.game;S.ttw.want=S.w.ttw;if(S.w.fo3)S.cfg.fo3=S.w.fo3;go("home")}
};
function savePath(f){const k=f.dataset.key,v=f.value.trim();if(k==="game"&&!v){status("New Vegas folder can't be empty.");f.value=S.cfg.game;return}if(S.cfg[k]!==v){S.cfg[k]=v;status(f.labels[0].firstChild.textContent.trim()+" saved.");render()}}
let lodTimer=null;
function runLod(idx){
  idx.forEach(i=>{LOD[i].p=0});S.lodRun=true;render('[data-act="lod-stop"]');clearInterval(lodTimer);
  lodTimer=setInterval(()=>{const i=idx.find(j=>LOD[j].p<100);
    if(i===undefined){clearInterval(lodTimer);S.lodRun=false;idx.forEach(j=>{LOD[j].old=false;LOD[j].t="Just now"});status("LOD done: all blocks current.");render();return}
    const b=LOD[i];b.p=Math.min(100,b.p+(S.cfg.reduce?25:7));if(b.p>=100)b.old=false;
    setProg("lodm"+i,b.p);const cell=document.getElementById("lodb"+i);if(cell)cell.innerHTML=lodSt(b);   /* in place: no re-render */
  },120);
}
/* ---------- dialogs ---------- */
let lastFocus=null,D={};
function openDlg(html){lastFocus=focusKey();$("#dlg").innerHTML=html;$("#dlgScrim").classList.add("open");$("#app").inert=true;const f=$("#dlg input")||$("#dlg .btn.primary:not([disabled])")||$("#dlg .btn");if(f)f.focus()}
function closeDlg(){$("#dlgScrim").classList.remove("open");$("#app").inert=false;D={};render(lastFocus||"#pgh")}
function openConfirm(title,body,yes,fn){D={kind:"confirm",fn};openDlg(`<h2 id="dlgTitle">${esc(title)}</h2><p class="muted">${esc(body)}</p><div class="dlg-foot"><button class="btn" data-dlg="close">Cancel</button><button class="btn ${/Remove|Stop/.test(yes)?"danger":"primary"}" data-dlg="yes">${esc(yes)}</button></div>`);$('#dlg [data-dlg="close"]').focus()}
function stepsHtml(names,cur){return `<ol class="steps" aria-label="Steps">${names.map((l,i)=>`<li class="${i+1<cur?"done":""}" ${i+1===cur?'aria-current="step"':""}>${i+1<cur?ico("ok")+'<span class="sr">Done: </span>':""}${l}</li>`).join("")}</ol>`}
/* install mod: plan / review / install */
function openInstall(){D={kind:"install",step:1,p:0};openDlg(installHtml())}
function installHtml(){
  let b="";
  if(D.step===1)b=`<p><b>sample-armor-set-b.7z</b> <span class="muted">54 files · 32 MB</span></p><pre class="diff">+ 48  textures/armor/sample_b/…
+  5  meshes/armor/sample_b/…
+  1  SampleArmorB.esp  (after SampleWeaponsA.esp)</pre>`;
  else if(D.step===2)b=`<div class="note"><span class="warn">${ico("warn")}</span><span>2 files shared with Sample Weapon Set A<span class="d">The new mod wins. Nothing is deleted.</span></span></div><dl class="facts"><dt>Disk</dt><dd>+32 MB</dd><dt>Plugins</dt><dd>+1</dd><dt>Undo</dt><dd>Restore point saved first</dd></dl>`;
  else b=`${prog("insM",D.p,"Installing")}${D.p>=100?`<div class="note"><span class="ok">${ico("ok")}</span><span>Installed and enabled<span class="d">Restore point saved.</span></span></div>`:`<p class="muted">Copying files · can't cancel mid-copy</p>`}`;
  return `<h2 id="dlgTitle">${ico("crate")}Install mod</h2>${stepsHtml(["Plan","Review","Install"],D.step)}${b}
  <div class="dlg-foot">${D.step<3?`<button class="btn" data-dlg="close">Cancel</button>${D.step>1?`<button class="btn" data-dlg="back">Back</button>`:""}<button class="btn primary" data-dlg="next">${D.step===2?"Install":"Next"}</button>`:`<button class="btn primary" data-dlg="done" ${D.p>=100?"":"disabled"}>Done</button>`}</div>`;
}
/* set up TTW: sources / output / review / install */
function openTtw(){D={kind:"ttw",step:1,tNv:S.cfg.game,tFo3:S.cfg.fo3,tPkg:"",tOut:S.cfg.ttw||"D:\\Example\\Games\\TTW"};openDlg(ttwHtml())}
function ttwHtml(){
  let b="";const found=v=>v?st("ok","Found"):st("unset","Not set");
  if(D.step===1)b=`<p class="muted" style="margin-top:0">TTW is built from your own Fallout 3 and New Vegas installs. Both stay untouched.</p><div class="form">
    <div class="lbl"><label for="tFo3">Fallout 3</label></div><div class="field"><input type="text" id="tFo3" class="mono" value="${esc(D.tFo3)}" placeholder="Fallout 3 folder">${found(D.tFo3)}<button class="btn" data-act="browse" data-for="tFo3">Browse</button></div>
    <div class="lbl"><label for="tNv">New Vegas</label></div><div class="field"><input type="text" id="tNv" class="mono" value="${esc(D.tNv)}">${found(D.tNv)}<button class="btn" data-act="browse" data-for="tNv">Browse</button></div>
    <div class="lbl"><label for="tPkg">TTW installer</label></div><div class="field"><input type="text" id="tPkg" class="mono" value="${esc(D.tPkg)}" placeholder="Installer package">${found(D.tPkg)}<button class="btn" data-act="browse" data-for="tPkg">Browse</button></div></div>`;
  else if(D.step===2)b=`<div class="form"><div class="lbl"><label for="tOut">Install to</label></div><div class="field"><input type="text" id="tOut" class="mono" value="${esc(D.tOut)}"><button class="btn" data-act="browse" data-for="tOut">Browse</button></div>
    <div class="lbl">Space</div><div class="field">26 GB needed · 48 GB free ${st("ok","Enough")}</div></div>`;
  else if(D.step===3)b=`<div class="note"><span class="ok">${ico("ok")}</span><span>Fallout 3 checked<span class="d">${esc(D.tFo3)}</span></span></div><div class="note"><span class="ok">${ico("ok")}</span><span>New Vegas checked<span class="d">${esc(D.tNv)}</span></span></div><div class="note"><span class="ok">${ico("ok")}</span><span>Installer checked<span class="d">TTW ${esc(S.ttw.ver)}</span></span></div><dl class="facts"><dt>Output</dt><dd class="mono">${esc(D.tOut)}</dd><dt>Time</dt><dd>About 40 minutes</dd><dt>Afterwards</dt><dd>TTW appears in Mods as a bundle you can enable or disable</dd></dl>`;
  else b=`${prog("ttwD",S.ttw.p,"TTW install")}<p class="muted">${S.ttw.p>=100?"Done.":["Checking sources","Extracting","Patching","Building archives","Registering"][S.ttw.stage]+" · you can close this; it keeps going"}</p>`;
  const can=D.step!==1||(D.tFo3&&D.tPkg&&D.tNv);
  if(D.step===1&&!can)b+=`<p class="muted" style="font-size:.9rem">To continue, set ${[!D.tFo3&&"the Fallout 3 folder",!D.tNv&&"the New Vegas folder",!D.tPkg&&"the TTW installer"].filter(Boolean).join(" and ")}.</p>`;
  return `<h2 id="dlgTitle">${ico("worlds")}Set up TTW</h2>${stepsHtml(["Sources","Output","Review","Install"],D.step)}${b}
   <div class="dlg-foot">${D.step<4?`<button class="btn" data-dlg="close">Cancel</button>${D.step>1?`<button class="btn" data-dlg="back">Back</button>`:""}<button class="btn primary" data-dlg="next" ${can?"":"disabled"}>${D.step===3?"Install":"Next"}</button>`:`<button class="btn ${S.ttw.p>=100?"primary":""}" data-dlg="close">${S.ttw.p>=100?"Done":"Hide"}</button>`}</div>`;
}
let ttwTimer=null;
function runTtw(){S.ttw.state="installing";S.ttw.p=0;S.ttw.stage=0;clearInterval(ttwTimer);
  ttwTimer=setInterval(()=>{S.ttw.p=Math.min(100,S.ttw.p+(S.cfg.reduce?20:4));S.ttw.stage=Math.min(4,Math.floor(S.ttw.p/20));
    setProg("ttwD",S.ttw.p);setProg("ttwM",S.ttw.p);
    if(S.ttw.p>=100){clearInterval(ttwTimer);S.ttw.state="installed";S.ttw.on=true;S.ttw.want=true;status("TTW installed and enabled.");if(D.kind==="ttw"){$("#dlg").innerHTML=ttwHtml();$('#dlg [data-dlg="close"]').focus()}else render()}},200)}
$("#dlg").addEventListener("input",e=>{if(D.kind==="ttw"&&e.target.id){D[e.target.id]=e.target.value;const n=$('#dlg [data-dlg="next"]');if(n&&D.step===1)n.disabled=!(D.tFo3&&D.tPkg&&D.tNv)}});
$("#dlg").addEventListener("click",e=>{
  const br=e.target.closest('[data-act="browse"]');if(br){A.browse(br);const n=$('#dlg [data-dlg="next"]');if(D.kind==="ttw"&&D.step===1){$("#dlg").innerHTML=ttwHtml();$("#"+br.dataset.for).focus()}return}
  const b=e.target.closest("[data-dlg]");if(!b)return;const a=b.dataset.dlg;
  if(a==="close"){closeDlg();return}
  if(a==="yes"){const f=D.fn;closeDlg();f();return}
  if(D.kind==="install"){
    if(a==="done"){if(!MODS.some(m=>m.id===9))MODS.push({id:9,name:"Sample Armor Set B",ver:"1.0",files:54,size:"32 MB",on:true,desc:"Invented armour set.",conf:[{with:3,files:2,wins:true}]});S.selMod=9;closeDlg();status("Installed Sample Armor Set B.");return}
    if(a==="back"){D.step--;$("#dlg").innerHTML=installHtml();$("#dlg .btn.primary").focus();return}
    if(a==="next"){D.step++;$("#dlg").innerHTML=installHtml();
      if(D.step===3){const t=setInterval(()=>{D.p=Math.min(100,D.p+(S.cfg.reduce?50:15));if(D.p>=100){clearInterval(t);$("#dlg").innerHTML=installHtml();$("#dlg .btn.primary").focus();status("Installed. Press Done.")}else setProg("insM",D.p)},150);$("#dlg .btn").focus()}
      else $("#dlg .btn.primary").focus()}
  }
  if(D.kind==="ttw"){
    if(a==="back"){D.step--;$("#dlg").innerHTML=ttwHtml();$("#dlg .btn.primary").focus();return}
    if(a==="next"){if(D.step===1){S.cfg.fo3=D.tFo3;S.cfg.game=D.tNv}if(D.step===2){S.cfg.ttw=D.tOut}D.step++;if(D.step===4)runTtw();$("#dlg").innerHTML=ttwHtml();($("#dlg .btn.primary")||$('#dlg [data-dlg="close"]')).focus()}
  }
});
$("#dlgScrim").addEventListener("click",e=>{if(e.target.id==="dlgScrim"&&!(D.kind==="install"&&D.step===3))closeDlg()});
/* ---------- command palette and key help ---------- */
const CMDS=()=>[
 ...PG.map(p=>({l:"Go to "+p[1],f:()=>go(p[0])})),
 {l:"Play",f:()=>A.launch()},{l:"Install mod",f:()=>openInstall()},{l:"Set up TTW",f:()=>openTtw()},{l:"Sort load order",f:()=>{go("order");A["order-sort"]()}},
 {l:"Generate LOD",f:()=>{go("lod");A["lod-run"]()}},{l:"Update all versions",f:()=>{go("versions");A["u-all"]()}},{l:"Run health checks",f:()=>{go("doctor");A.recheck()}},
 {l:"Change New Vegas folder",f:()=>go("prefs","#fGame")},{l:"Change Fallout 3 folder",f:()=>go("prefs","#fFo3")},{l:"Manage engine versions",f:()=>go("versions")},
 ...MODS.map(m=>({l:"Mod: "+m.name,f:()=>{S.selMod=m.id;go("mods",`tr[data-mod="${m.id}"]`)}})),
 {l:"Reduce motion on / off",f:()=>{S.cfg.reduce=!S.cfg.reduce;save();render()}},{l:"Run setup again",f:()=>A.wizard()}];
let palSel=0,palItems=[];
function openPal(){D={kind:"pal"};openDlg(`<div class="pal"><h2 id="dlgTitle">${ico("search")}Search or run</h2><input type="text" id="palIn" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list" aria-label="Command or mod"><ul id="palList" role="listbox" aria-label="Results"></ul><p class="sr" id="palCount" aria-live="polite"></p></div>`);palSel=0;palRender();
  $("#palIn").addEventListener("input",()=>{palSel=0;palRender()});
  $("#palIn").addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){palSel=Math.max(0,Math.min(palItems.length-1,palSel+(e.key==="ArrowDown"?1:-1)));palRender();e.preventDefault()}else if(e.key==="Enter"&&palItems[palSel]){const c=palItems[palSel];closeDlg();c.f();e.preventDefault()}});
  $("#palList").addEventListener("click",e=>{const r=e.target.closest("[data-pi]");if(r){const c=palItems[+r.dataset.pi];closeDlg();c.f()}})}
function palRender(){const q=$("#palIn").value.toLowerCase().trim();palItems=CMDS().filter(c=>!q||q.split(/\s+/).every(w=>c.l.toLowerCase().includes(w))).slice(0,12);
  $("#palList").innerHTML=palItems.length?palItems.map((c,i)=>`<li role="option" id="pal${i}" data-pi="${i}" aria-selected="${i===palSel}">${esc(c.l)}</li>`).join(""):`<li role="option" aria-disabled="true">No match</li>`;
  $("#palIn").setAttribute("aria-activedescendant",palItems.length?"pal"+palSel:"");$("#palCount").textContent=palItems.length+" results"}
function openKeys(){D={kind:"keys"};openDlg(`<h2 id="dlgTitle">Keys</h2><div class="keys">
  <kbd>Ctrl K</kbd><span>Search or run</span><kbd>1–7</kbd><span>Home, Mods, Load order, LOD, Versions, Doctor, Settings</span><kbd>↑ ↓</kbd><span>Move in the mod list</span><kbd>Space</kbd><span>Enable / disable mod</span>
  <kbd>Enter</kbd><span>Run button · jump to mod actions</span><kbd>Esc</kbd><span>Close dialog</span><kbd>?</kbd><span>This list</span></div><div class="dlg-foot"><button class="btn primary" data-dlg="close">Close</button></div>`)}
/* ============ input ============ */
document.addEventListener("click",e=>{
  if(e.target.closest("#dlg"))return;
  const nav=e.target.closest("[data-page]");if(nav){e.preventDefault();go(nav.dataset.page);return}
  const t=e.target.closest("[data-act]");
  if(t){A[t.dataset.act]&&A[t.dataset.act](t);return}
  const r=e.target.closest("tr[data-mod]");if(r){S.selMod=r.dataset.mod==="ttw"?"ttw":+r.dataset.mod;render(`tr[data-mod="${r.dataset.mod}"]`)}
});
document.addEventListener("change",e=>{const t=e.target;if(t.closest("#dlg"))return;
  if(t.dataset.key){savePath(t);return}
  if(t.id==="fProfM"){S.cfg.profile=t.value;status("Profile: "+t.value+".");render("#fProfM")}
  if(t.id==="onlyOn"){S.onlyOn=t.checked;render("#onlyOn")}
  if(t.name==="wTtwR"){S.w.ttw=t.value==="yes";render(S.w.ttw?"#wFo3":"#wTtwNo")}
});
document.addEventListener("input",e=>{if(e.target.id==="modFilter"){S.filter=e.target.value;render("#modFilter")}});
document.addEventListener("keydown",e=>{
  const open=$("#dlgScrim").classList.contains("open");
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(open&&D.kind==="pal")closeDlg();else if(!open&&!S.wiz)openPal();return}
  if(e.key==="Escape"){if(open){if(D.kind==="install"&&D.step===3&&D.p<100)status("Can't cancel mid-copy.");else closeDlg()}return}
  if(open){if(e.key==="Tab"){const f=[...$("#dlg").querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])')];if(!f.length){e.preventDefault();return}const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){f[f.length-1].focus();e.preventDefault()}else if(!e.shiftKey&&i===f.length-1){f[0].focus();e.preventDefault()}}return}
  const a=document.activeElement;if(a&&a.closest&&a.closest("input:not([type=checkbox]),select,textarea"))return;
  if(S.wiz)return;
  if(e.key==="?"){openKeys();return}
  const row=a&&a.closest&&a.closest("tr[data-mod]");
  if(row){const rows=[...document.querySelectorAll("tr[data-mod]")];const i=rows.indexOf(row);
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){const n=rows[Math.max(0,Math.min(rows.length-1,i+(e.key==="ArrowDown"?1:-1)))];S.selMod=n.dataset.mod==="ttw"?"ttw":+n.dataset.mod;render(`tr[data-mod="${n.dataset.mod}"]`);e.preventDefault();return}
    if(e.key===" "&&a===row){row.dataset.mod==="ttw"?A["ttw-toggle"]():A.toggle({dataset:{id:row.dataset.mod}});e.preventDefault();return}
    if(e.key==="Enter"&&a===row){const b=$('#view .detail .acts .btn');if(b)b.focus();e.preventDefault();return}}
  if(!e.ctrlKey&&!e.altKey&&!e.metaKey&&/^[1-7]$/.test(e.key)&&!(a&&a.type==="checkbox")){go(PG[+e.key-1][0]);return}
});
/* ============ boot ============ */
(function(){const h=location.hash.slice(1);if(PG.some(p=>p[0]===h)){S.page=h;render("#pgh")}else{S.wiz=1;render("#wGame")}})();
</script>
