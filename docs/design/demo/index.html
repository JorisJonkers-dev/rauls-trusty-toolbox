<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raul's Toolbox</title>
<style>
/* SPDX-License-Identifier: GPL-3.0-only */
:root{
  --bg:#101215;--raise:#181C22;--raise2:#222831;--sel:#2A3240;--hover:#29303B;--line:#2F353F;--ctl:#7A848F;
  --text:#E6E8EB;--muted:#A3ACB7;--accent:#3DD6C6;--on-accent:#0B1513;--brand:#F59E3B;
  --ok:#4CC38A;--warn:#FF9A4D;--err:#FF7A7A;--info:#6EA8FE;--sunk:#0C0E10;--choice:#B79CFF;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono','DejaVu Sans Mono',Menlo,Consolas,monospace;
  --fs:14px;
  color-scheme:dark;
}
[data-hc="1"]{--bg:#000;--raise:#000;--raise2:#000;--sel:#111;--hover:#151515;--line:#B8B8B8;--ctl:#fff;--text:#fff;--muted:#E0E0E0;
  --accent:#5CF2E2;--ok:#6FE8A6;--warn:#FFB066;--err:#FF8A8A;--info:#8DBBFF;--sunk:#000}
[data-fs="l"]{--fs:15.5px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#07080A;color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.45}
.desk{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1A1F27 0,#0B0D10 70%)}
.win{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--ws,1));transform-origin:center;background:var(--bg);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);display:flex;flex-direction:column}
.tbar{flex:none;height:34px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;background:#0B0D10;color:var(--muted);font-size:.84rem;font-weight:600;user-select:none}
.tbar .tsp{flex:1}.tbi{display:inline-flex;color:var(--brand)}
.wbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:28px;border-radius:7px;color:var(--muted)}
.wbtn:hover{background:var(--raise2);color:var(--text)}.wbtn.close:hover{background:#C4403A;color:#fff}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
:focus{outline:none}
:focus-visible{outline:1px solid rgba(61,214,198,.75);outline-offset:1px}
/* text fields: the caret is the only focus sign */
input:focus,input:focus-visible,textarea:focus,textarea:focus-visible{outline:none;box-shadow:none}
.r:focus-visible,.sech:focus-visible,.logl:focus-visible,.pal .pi:focus-visible{outline:none;background:var(--sel)}
.mono{font-family:var(--mono);font-size:.9em}
.muted{color:var(--muted)}
.okc{color:var(--ok)}.warnc{color:var(--warn)}.errc{color:var(--err)}.infoc{color:var(--info)}.accc{color:var(--accent)}
svg.i{flex:none;display:inline-block;vertical-align:-3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
#app{flex:1;min-height:0;display:grid;grid-template-rows:64px 1fr 32px;grid-template-columns:216px 1fr;overflow:hidden}
.top{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;background:var(--raise);margin:8px 8px 0;border-radius:14px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;color:var(--brand);font-weight:700;white-space:nowrap;margin-right:10px}
.tchip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;color:var(--muted);white-space:nowrap}
.tchip:hover{background:var(--raise2);color:var(--text)}
.tchip b{color:var(--text);font-weight:600}
.tsp{flex:1}
.srchbtn{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 14px;border-radius:999px;background:var(--bg);color:var(--muted);min-width:240px}
.srchbtn:hover{color:var(--text)}
.kbd{display:inline-flex;align-items:center;font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:auto}
.side{padding:12px 8px;overflow:auto}
.navh{font-size:.74rem;letter-spacing:.08em;font-weight:700;color:var(--muted);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border-radius:12px;color:var(--muted);font-weight:500;text-align:left}
.nav:hover{background:var(--raise);color:var(--text)}
.nav.on{background:var(--raise2);color:var(--text)}
.nav.on>svg{color:var(--accent)}
.bdg{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;font-size:.75rem;font-weight:700;padding:0 6px;color:#101215;background:var(--info)}
.bdg.warn{background:var(--warn)}.bdg.err{background:var(--err)}
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
.mscroll{flex:1 1 auto;min-height:0;overflow:auto;padding:18px 24px 84px}
.pg{animation:pgin .22s ease-out}
@keyframes pgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--muted);font-size:.86rem}
.foot .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.foot .dot.busy{background:var(--accent);animation:pulse 1.4s infinite}
.foot .sp{flex:1}

/* page header */
.phdr{display:flex;align-items:center;gap:14px;margin-bottom:16px;min-height:48px;flex-wrap:wrap}
.phdr .ico{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:var(--raise2);color:var(--accent)}
.phdr h1{font-size:1.55rem;margin:0;font-weight:750;letter-spacing:-.01em}
.phdr .st{color:var(--muted)}
.phdr .rgt{margin-left:auto;display:flex;gap:8px;align-items:center}
.ppill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border-radius:999px;background:var(--raise2);font-weight:600}
.ppill:hover{background:var(--hover)}
.ppill .lb{color:var(--muted);font-weight:500}

/* blocks */
.card{background:var(--raise);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card.sunk{background:var(--raise2)}
div.sec{background:var(--raise);border-radius:16px;padding:12px;margin-bottom:12px}
.sech{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;min-height:48px;margin:0 0 6px;border-radius:12px}
.sech .t{font-size:.82rem;letter-spacing:.06em;font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sech .t::before{content:"";width:6px;height:16px;border-radius:3px;background:var(--accent)}
.sech .r8{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted)}
.fold{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--raise2);transition:transform .18s}
.fold:hover{background:var(--hover)}
.fold.on{transform:rotate(90deg)}
.sech.click{cursor:pointer;user-select:none}
.rows{display:flex;flex-direction:column;gap:6px}
.r{display:flex;align-items:center;gap:12px;border-radius:12px;background:var(--raise2);min-height:48px;padding:6px 14px}
.r.click{cursor:pointer}
.r.click:hover{background:var(--hover)}
.r .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .sub{color:var(--muted);font-size:.86rem}
.r .end{margin-left:auto;display:flex;gap:10px;align-items:center;flex:none}
.r.dim .nm{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:.92rem}
.kv>dt{color:var(--muted)}.kv>dd{margin:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-weight:600;white-space:nowrap;background:var(--raise2);color:var(--text);transition:background .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.primary:hover:not(:disabled){background:#5DE3D5}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--text);background:var(--raise2)}
.btn.danger{color:var(--err)}
.btn.dangerp{background:var(--err);color:#1a0b0b}
.btn.sm{height:32px;padding:0 12px;font-size:.88rem}
.btn.icon{width:36px;height:36px;padding:0}
.btn.busy svg{animation:spin 1s linear infinite}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:13px;background:var(--bg);color:var(--muted);font-weight:600;font-size:.8rem;white-space:nowrap}
.tag.ok{background:rgba(76,195,138,.14);color:var(--ok)}
.tag.warn{background:rgba(255,154,77,.14);color:var(--warn)}
.tag.err{background:rgba(255,122,122,.14);color:var(--err)}
.tag.info{background:rgba(110,168,254,.14);color:var(--info)}
.tag.acc{background:rgba(61,214,198,.14);color:var(--accent)}
.stt{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:var(--sunk);flex:none;transition:background .15s;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;left:3px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:left .15s,background .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{left:19px;background:#0B1513}
.sw[aria-checked="mixed"]::after{left:11px}
.cb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ctl);flex:none;color:var(--on-accent)}
.cb[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.segc{display:inline-flex;background:var(--raise2);border-radius:999px;padding:3px;gap:2px}
.segc button{height:34px;padding:0 16px;border-radius:999px;color:var(--muted);font-weight:500}
.segc button:hover{color:var(--text)}
.segc button[aria-pressed="true"],.segc button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.srch{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--raise);color:var(--muted);min-width:240px}
.srch input{background:transparent;border:0;flex:1;min-width:0;color:var(--text)}
.srch input::placeholder{color:var(--muted)}
.inp{height:40px;border:0;border-radius:12px;background:var(--sunk);padding:0 12px;color:var(--text);min-width:0}
.inp.mono{font-size:.88rem}
select.inp{padding-right:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:600}
.err-text{color:var(--err);font-size:.88rem}
.rng{accent-color:var(--accent);width:220px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pb{height:8px;border-radius:4px;background:var(--raise2);overflow:hidden;position:relative}
.pb i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .35s ease;background-image:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.25) 50%,rgba(255,255,255,0) 100%);background-size:60px 100%;background-repeat:no-repeat;animation:sheen 1.4s linear infinite}
.pb.warn i{background-color:var(--warn)}.pb.err i{background-color:var(--err)}
.pb.ind i{position:absolute;width:30%;animation:slide 1.2s ease-in-out infinite;background-image:none}
@keyframes sheen{from{background-position:-60px 0}to{background-position:calc(100% + 60px) 0}}
@keyframes slide{from{left:-30%}to{left:100%}}

/* action bar */
.abar{position:absolute;right:20px;bottom:14px;z-index:20;display:flex;align-items:center;gap:6px;height:48px;padding:6px;margin:0;background:var(--raise2);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05);max-width:calc(100% - 40px)}
.abar .btn{height:36px;padding:0 16px;margin:0;border-radius:999px;align-self:center;transform:none;box-shadow:none;line-height:1}
.abar .btn:not(.primary){background:transparent}.abar .btn:not(.primary):hover:not(:disabled){background:var(--hover)}
.abar .btn.sec{background:var(--sel)}
.abar .note{color:var(--muted);margin-right:6px;font-size:.9rem}
.cca{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;align-items:center}
.cca .note{margin-right:auto;color:var(--muted);font-size:.9rem}

/* banners and recommendation */
.banner{display:flex;align-items:center;gap:14px;background:var(--raise);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.banner .bi{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--raise2);flex:none}
.banner.ok .bi{color:var(--ok)}.banner.warn .bi{color:var(--warn)}.banner.err .bi{color:var(--err)}.banner.info .bi{color:var(--info)}.banner.acc .bi{color:var(--accent)}
.banner .bt{font-weight:650}
.banner .bs{color:var(--muted);font-size:.92rem}
.banner .ba{margin-left:auto;display:flex;gap:8px;flex:none}
.rec{border:1px dashed rgba(255,154,77,.55)}

/* mods */
.mrow{border-radius:12px;background:var(--raise2);transition:background .15s}
.mrow .r{background:transparent}
.mrow:hover{background:var(--hover)}
.mrow.open{background:var(--sel)}
.mrow.dragsrc{opacity:.35}
.grip{display:inline-flex;color:var(--ctl);cursor:grab;width:22px;justify-content:center;touch-action:none}
.grip:hover{color:var(--text)}
.num{width:26px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.ver{font-family:var(--mono);font-size:.84rem;color:var(--muted);min-width:56px;text-align:right}
.chev{display:inline-flex;transition:transform .18s;color:var(--muted)}
.chev.on{transform:rotate(90deg)}
.mdet{padding:4px 16px 14px 96px;display:grid;grid-template-columns:1fr auto;gap:12px;animation:pgin .18s ease-out}
.mdet .kv{grid-template-columns:110px 1fr}
.mdet .acts{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;justify-content:flex-end}
.dropline{height:4px;border-radius:2px;background:var(--accent);margin:-1px 8px}
.dghost{position:fixed;z-index:60;pointer-events:none;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--sel);box-shadow:0 12px 30px rgba(0,0,0,.6);transform:rotate(-1.2deg);width:520px}
.grp.dragsrc{opacity:.35}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.hl{background:rgba(61,214,198,.25);color:var(--text);border-radius:3px}
mark{background:rgba(61,214,198,.3);color:inherit;border-radius:3px}
.moved{box-shadow:inset 3px 0 0 var(--accent)}

/* tests */
.stiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stile{background:var(--raise2);border-radius:12px;padding:10px 14px}
.stile .sv{font-size:1.45rem;font-weight:750;margin:2px 0}
.stile .sl{color:var(--muted);font-size:.86rem}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.logbox{background:var(--sunk);border-radius:12px;padding:6px 4px;max-height:260px;overflow:auto}
.logl{display:flex;gap:10px;align-items:flex-start;padding:6px 10px;border-radius:8px;font-size:.86rem;width:100%;text-align:left}
.logl:hover{background:var(--raise)}
.logl .tm{font-family:var(--mono);color:var(--muted);flex:none}
.logd{padding:4px 10px 10px 34px;color:var(--muted);font-size:.86rem}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pic{background:var(--raise2);border-radius:12px;padding:8px}
.pic .vp{overflow:hidden;border-radius:8px;aspect-ratio:16/9;position:relative;background:#0b0d10}
.pic .vp{cursor:grab;touch-action:none;user-select:none}.pic .vp.panning{cursor:grabbing}
.pic .vp svg{width:100%;height:100%;display:block;transform-origin:0 0}
.pics.one{grid-template-columns:1fr}
.places .btn.sm{height:30px;padding:0 12px;font-size:.84rem}
.pic .cap{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 2px;font-size:.88rem}
.places{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;max-height:178px;overflow-y:auto}
.places.strip{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:4px;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.places.strip .btn{flex:none}
.plrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.nowrap{white-space:nowrap}

/* stepper */
.stp{display:flex;align-items:center;gap:12px;background:var(--raise);border-radius:16px;padding:14px 18px;margin-bottom:14px}
.stp .s{display:flex;align-items:center;gap:10px;flex:none}
.stp .n{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--raise2);font-weight:700;color:var(--muted)}
.stp .s.cur .n{border:2px solid var(--accent);color:var(--accent)}
.stp .s.done .n{background:var(--accent);color:var(--on-accent)}
.stp .s.bad .n{background:var(--err);color:#1a0b0b}
.stp .lb{display:flex;flex-direction:column;line-height:1.2}
.stp .lb b{font-weight:600}
.stp .lb span{font-size:.82rem;color:var(--muted)}
.stp .ln{flex:1;height:4px;border-radius:2px;background:var(--raise2);min-width:10px}
.stp .ln.on{background:var(--accent)}

/* LOD page */
.farhero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:center}
.farhero>div:first-child>svg{width:100%;height:auto;display:block}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:center;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{background:var(--raise);border-radius:20px;padding:20px 22px;width:520px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .18s ease-out}
.dlg.wide{width:760px}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.dlg h2{margin:0 0 6px;font-size:1.2rem}
.dlg p{margin:0 0 12px;color:var(--muted)}
.menu{position:fixed;z-index:50;background:var(--raise2);border-radius:14px;padding:6px;min-width:220px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:pop .12s ease-out}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 12px;border-radius:10px;text-align:left;white-space:nowrap}
.menu .mi:hover,.menu .mi:focus-visible{background:var(--sel);outline:none}
.menu .mi.danger{color:var(--err)}
.menu .sepm{height:1px;background:var(--line);margin:6px 8px}
.menu .mh{font-size:.74rem;letter-spacing:.08em;font-weight:700;color:var(--muted);padding:8px 12px 4px;text-transform:uppercase}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;width:440px;z-index:55;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;background:var(--sel);border-radius:14px;padding:8px 8px 8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .18s ease-out}
.toast>span:first-child{flex:1;min-width:0}
.toast .btn{height:32px;flex:none}
.toast .btn.icon{width:32px;height:32px}
.pal{width:600px;padding:12px}
.pal .srch{width:100%;margin-bottom:8px}
.pal .pi{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border-radius:10px;text-align:left}
.pal .pi.on{background:var(--sel)}
.pal .pi .k{margin-left:auto;color:var(--muted);font-size:.84rem}
.picker .r{cursor:pointer}
.picker .r[aria-selected="true"]{background:var(--sel);box-shadow:inset 0 0 0 2px var(--accent)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--raise2);margin-bottom:6px;cursor:pointer;width:100%;text-align:left}
.opt:hover{background:var(--hover)}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.opt .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ctl);flex:none;margin-top:1px;display:inline-flex;align-items:center;justify-content:center}
.opt[aria-checked="true"] .rd{border-color:var(--accent)}
.opt[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.opt .od{color:var(--muted);font-size:.88rem}
.fomod{display:grid;grid-template-columns:1fr 240px;gap:14px}
.fomod .prev{background:var(--raise2);border-radius:12px;padding:10px}
.scen{position:fixed;right:16px;bottom:44px;z-index:58;width:340px;background:var(--raise2);border-radius:16px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.scen .r{background:var(--raise);min-height:40px}

/* wizard */
.wizm{grid-column:1/3;grid-row:2/3}
.wiz{flex:1 1 auto;min-height:0;overflow:auto;padding:22px 32px 120px;display:flex;flex-direction:column}
.wiz .inner{max-width:900px;width:100%;margin:0 auto;flex:1}
.wiz .hero{display:flex;gap:28px;align-items:center;background:var(--raise);border-radius:20px;padding:28px}
.wiz h1{font-size:1.9rem;margin:0 0 8px;letter-spacing:-.01em}
.wiz .lead{color:var(--muted);font-size:1.05rem;margin:0 0 10px;max-width:520px}
.wizbar{grid-column:1/3;display:flex;justify-content:flex-end}
.pcards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--raise2);border-radius:16px;padding:14px 16px;cursor:pointer}
.pcard:hover{background:var(--hover)}
.pcard[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--accent);background:var(--sel)}
.pcard .pt{display:flex;gap:10px;align-items:center;font-weight:700;font-size:1.05rem}
.pcard .pd{color:var(--muted);font-size:.9rem}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .spin,.btn.busy svg,.foot .dot.busy{animation:pulse 1.6s ease-in-out infinite!important;animation-duration:1.6s!important}
  .pb.ind i{left:35%}
}
[data-motion="0"] *,[data-motion="0"] *::before,[data-motion="0"] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
[data-motion="0"] .spin,[data-motion="0"] .btn.busy svg{animation:pulse 1.6s ease-in-out infinite!important;animation-duration:1.6s!important}
[data-hc="1"] .r,[data-hc="1"] .card,[data-hc="1"] div.sec,[data-hc="1"] .banner,[data-hc="1"] .btn,[data-hc="1"] .tag,[data-hc="1"] .abar,[data-hc="1"] .mrow,[data-hc="1"] .stile,[data-hc="1"] .top,[data-hc="1"] .menu,[data-hc="1"] .dlg{border:1px solid var(--line)}

.r .btn:not(.primary):not(.ghost),.card.sunk .btn:not(.primary):not(.ghost),.mdet .btn:not(.primary):not(.ghost){background:var(--sel)}
.r .btn:not(.primary):not(.ghost):hover{background:var(--hover)}
.mrow.open .btn:not(.primary):not(.ghost){background:var(--raise2)}

/* versions timeline */
.tlist{gap:0}
.tl{position:relative;padding:0 0 8px 30px}
.tl::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line)}
.tl:first-child::before{top:24px}.tl:last-child::before{bottom:calc(100% - 24px)}
.tld{position:absolute;left:4px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--ctl);border:3px solid var(--raise)}
.tl.pass .tld{background:var(--ok)}.tl.fail .tld{background:var(--err)}
.mrow.curv{box-shadow:inset 0 0 0 2px var(--accent)}
.chart .pt{cursor:pointer}.chart .pt:hover circle:last-child,.chart .pt:focus-visible circle:last-child{r:7}
.chart .pt:focus{outline:none}.chart .pt:focus-visible circle:first-child{stroke:var(--accent);stroke-width:1}
.menu .mi:disabled{opacity:1;color:var(--muted);cursor:default}
.sw[aria-checked="mixed"]{background:rgba(61,214,198,.3);border-color:var(--accent)}.sw[aria-checked="mixed"]::after{background:var(--accent)}

/* whole-row hit areas */
.hit{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-6px -6px;flex:none;cursor:pointer;border-radius:10px}
.hit:hover{background:rgba(255,255,255,.04)}
.r.click{cursor:pointer}
.mrow .r.click:hover{background:var(--hover)}
.mrow.open .r.click:hover{background:transparent}
.sech.click:hover{background:var(--raise2)}

/* equal insets: every row in a card is as wide as its header bar */
div.sec>.rows,div.sec>.bar,div.sec>.dropline{margin-left:0;margin-right:0}
div.sec>.sech+.sech{margin-top:-2px}
div.sec>.sech:last-child{margin-bottom:0}
</style>

  runs.forEach((r, i) => { if (i < runs.length - 1) { const ev = p.events.filter(e => e.t > r.t && e.t <= runs[i + 1].t); ev.forEach((e, k) => { const xm = (x(i) + x(i + 1)) / 2 + k * 8; s += `<line x1="${xm}" x2="${xm}" y1="${T - 6}" y2="${H - B}" stroke="var(--info)" stroke-dasharray="3 4"/><circle cx="${xm}" cy="${T - 6}" r="4" fill="var(--info)"><title>${esc(e.label)}</title></circle>`; }); } });
  s += `<polyline fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 5" points="${runs.map((r, i) => `${x(i)},${y(r.low)}`).join(' ')}"/>`;
  s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.4" points="${runs.map((r, i) => `${x(i)},${y(r.avg)}`).join(' ')}"/>`;
  const off = p.bench.length - runs.length;
  runs.forEach((r, i) => { const v = (p.versions || []).find(vv => vv.id === r.vid), lab = v ? vLabel(v.t) : fdate(r.t), cur = v && v.id === p.cur;
    s += `<g class="pt" role="button" tabindex="0" aria-label="${r.avg} fps, version ${esc(lab)}" aria-haspopup="menu" data-act="ptMenu" data-arg="${off + i}" data-k="pt:${off + i}"><circle cx="${x(i)}" cy="${y(r.avg)}" r="12" fill="transparent"/><circle cx="${x(i)}" cy="${y(r.avg)}" r="${cur ? 6 : 4.5}" fill="var(--accent)" ${cur ? 'stroke="var(--text)" stroke-width="2"' : ''}/></g><text x="${x(i)}" y="${H - 20}" text-anchor="middle">${esc(lab.split(' ').slice(0, -1).join(' '))}</text><text x="${x(i)}" y="${H - 6}" text-anchor="middle">${lab.split(' ').slice(-1)[0]}</text>`; });
  return s + '</svg>';
}

/* ===== app shell and pages ===== */
let ABAR = '';
const abar = h => { ABAR = h; };
const NAV = [['PLAY', [['home', 'Home', 'home'], ['mods', 'Mods', 'mods'], ['load', 'Load order', 'load'], ['far', 'LOD', 'lod']]], ['SYSTEM', [['system', 'System', 'versions'], ['doctor', 'Doctor', 'doctor'], ['settings', 'Settings', 'settings']]]];
const PAGES = {};
const pillP = () => { const p = P(); return `<button type="button" class="ppill" data-act="profMenu" data-arg="pill" data-k="profMenu:pill" aria-haspopup="menu" aria-expanded="${U.menu && U.menu.id === 'prof' && U.menu.anchor === 'profMenu:pill'}">${ic('user', 16)}<span class="lb">Profile</span>${esc(p.name)}${ic('chevd', 14)}</button>`; };
const stableChip = p => !p.mods.some(m => m.on) ? '' : stableNow(p) ? tag('Tested stable', 'ok', 'shield') : tag('Not tested yet', 'warn', 'warn');
const hdr = (icon, title, status = '', right = '') => `<div class="phdr"><span class="ico">${ic(icon, 26)}</span><h1>${title}</h1>${status ? `<span class="st">${status}</span>` : ''}<div class="rgt">${right}</div></div>`;
const gx = x => { const w = winBox(); return (x - w.left) / w.s; }, gy = y => { const w = winBox(); return (y - w.top) / w.s; };
const swRow = ctl => { const m = /^<button type="button" class="sw" role="switch" [^>]*data-act="([^"]+)" data-arg="([^"]*)"/.exec(ctl); return m ? ` click" data-act="${m[1]}" data-arg="${m[2]}` : ''; };
const pageWrap = (key, html) => `<div class="pg" data-key="${key}">${html}</div>`;

function appHTML() {
  ABAR = '';
  const page = (PAGES[U.page] || PAGES.home)();
  return `${topHTML()}${sideHTML()}<main class="main" id="main" aria-label="${esc(pageTitle())}"><div class="mscroll">${page}</div>${ABAR ? `<div class="abar" role="toolbar" aria-label="Page actions">${ABAR}</div>` : ''}</main>${footHTML()}${overlays()}`;
}
const pageTitle = () => ({ home: 'Home', mods: 'Mods', load: 'Load order', far: 'LOD', farset: 'LOD settings', ttw: 'Add Tale of Two Wastelands', system: 'System', doctor: 'Doctor', settings: 'Settings' })[U.page] || 'Home';

function topHTML() {
  const p = P(), run = U.run, chk = U.play && U.play.state === 'checking';
  let play;
  if (run) play = `<button type="button" class="btn sec" data-act="stopGame" data-k="stopGame:">${ic('stop', 16)}<span>Stop · ${hm(Math.floor((Date.now() - run.start) / 1000))}</span></button>`;
  else if (U.play && U.play.state === 'starting') play = btn('Starting…', { k: 'primary', icon: 'play', busy: true, dis: true });
  else if (chk) play = btn(`Checking ${Math.min(U.play.i + 1, U.play.list.length)}/${U.play.list.length}`, { k: 'primary', busy: true, icon: 'play', dis: true });
  else play = btn('Play', { k: 'primary', icon: 'play', act: 'play', arg: '', title: 'Checks your setup, then starts the game' });
  return `<header class="top"><div class="brand">${ic('app', 22)}Raul's Toolbox</div>
  <button type="button" class="tchip" data-act="nav" data-arg="settings" data-k="top:game" title="Game folder">${ic('folder', 16)}New Vegas${S.g.scen.game || !S.g.gameOk ? ' ' + tag('Not found', 'err') : ''}</button>
  <button type="button" class="tchip" data-act="nav" data-arg="system" data-k="top:engine" title="Engine build">${ic('bolt', 16)}Engine <b class="mono">${S.g.engine}</b></button>
  <button type="button" class="tchip" data-act="profMenu" data-arg="top" data-k="profMenu:top" aria-haspopup="menu" aria-expanded="${!!(U.menu && U.menu.anchor === 'profMenu:top')}">${ic('user', 16)}Profile <b>${esc(p.name)}</b>${ic('chevd', 14)}</button>
  <span class="tsp"></span>
  <button type="button" class="srchbtn" data-act="palette" data-arg="" data-k="palette:">${ic('search', 16)}Search or go to…<span class="kbd">Ctrl K</span></button>${play}</header>`;
}
function sideHTML() {
  const doc = docSummary();
  const p = P(), mm = missingMasters(p).length, ooo = outOfOrder(p), unt = stableNow(p) ? 0 : 1, fs = farState(p), att = p.mods.filter(m => modAttention(m, p)).length + (p.ttwOn && !S.g.ttwInstalled ? 1 : 0);
  const b = (n, k, t) => n ? `<span class="bdg ${k}" title="${t}" aria-label="${t}">${n}</span>` : '';
  const bdg = { load: b(mm + ooo + unt, mm ? 'err' : 'warn', [mm && plural(mm, 'missing master'), ooo && `${ooo} out of order`, unt && 'untested change'].filter(Boolean).join(', ')), far: fs === 'never' || fs.startsWith('stale') ? b(1, 'warn', fs === 'never' ? 'LOD not built' : 'LOD out of date') : '', mods: b(att, mm ? 'err' : 'warn', plural(att, 'mod') + (att === 1 ? ' needs' : ' need') + ' attention'), system: updAvail() ? `<span class="bdg" title="Update available">${ic('up', 13)}</span>` : '', doctor: doc ? `<span class="bdg ${doc[0]}" title="${doc[1]}">${doc[2]}</span>` : '' };
  return `<nav class="side" aria-label="Pages">${NAV.map(([h, items]) => `<div class="navh">${h}</div>${items.map(([id, t, icon]) => `<button type="button" class="nav ${U.page === id || (id === 'far' && U.page === 'farset') || (id === 'mods' && U.page === 'ttw') ? 'on' : ''}" data-act="nav" data-arg="${id}" data-k="nav:${id}" ${U.page === id ? 'aria-current="page"' : ''}>${ic(icon, 18)}<span>${t}</span>${bdg[id] || ''}</button>`).join('')}`).join('')}</nav>`;
}
function docSummary() { if (!S.g.docRun) return null; const L = checks(); const f = L.filter(c => c.st === 'fail').length, w = L.filter(c => c.st === 'warn').length; return f ? ['err', `${f} failed`, f] : w ? ['warn', `${w} warnings`, w] : null; }
function footHTML() {
  const busy = Object.entries(J).filter(([k]) => !k.startsWith('find') && k !== 'play');
  let txt = 'Ready', dot = '';
  if (U.run) { txt = `Playing · ${esc(prof(U.run.pid).name)} · ${hm(Math.floor((Date.now() - U.run.start) / 1000))}`; dot = 'busy'; }
  else if (busy.length) { const [k, j] = busy[0]; txt = `${j.label || 'Working'} · ${Math.round(j.p * 100)} %${busy.length > 1 ? ` · ${busy.length - 1} more` : ''}`; dot = 'busy'; }
  return `<footer class="foot"><span class="dot ${dot}"></span><span role="status">${txt}</span><span class="sp"></span><button type="button" class="btn ghost sm" data-act="shortcuts" data-arg="" data-k="shortcuts:"><span class="kbd" style="margin:0">?</span><span>Shortcuts</span></button></footer>`;
}

/* ---------- Home ---------- */
function recCard(p, where) {
  if (stableNow(p) || p.dismissed.includes(sig(p))) return '';
  const running = J['stab:' + p.id];
  return `<div class="banner warn rec" role="note"><span class="bi">${ic('flask', 22)}</span><div><div class="bt">This mod setup hasn't been tested yet.</div><div class="bs">${running ? `Stability test running · ${Math.round(running.p * 100)} %` : 'A 20-minute test checks this exact set and order.'}</div></div><div class="ba">${running ? btn('Show test', { k: 'sec', act: 'stabShow', arg: '' }) : btn('Not now', { k: 'ghost', act: 'recDismiss', arg: where }) + (lastStable(p) ? btn('Revert to last stable', { k: 'sec', icon: 'undo', act: 'vRevertStable', arg: '' }) : '') + btn('Run stability test', { k: 'primary', icon: 'play', act: 'stabGo', arg: where })}</div></div>`;
}
const homeRows = p => {
  /* short list: game, TTW, mods, load order, LOD; storage, engine and mod-setup rows only when they need attention */
  const L = checks(p), want = ['game', 'ttw', 'mods', 'load', 'far'];
  return L.filter(c => want.includes(c.id) || c.st !== 'ok').filter(c => c.id !== 'stab').map(c => shortRow(c, p));
};
const shortRow = (c, p) => c.id === 'ttw' && c.st === 'ok' ? { ...c, st: p.ttwOn ? 'ok' : 'off', t: p.ttwOn ? 'Installed' : S.g.ttwInstalled ? 'Installed, off here' : 'Not added' } : { ...c, n: c.id === 'far' ? 'LOD' : c.n, t: c.st === 'ok' ? 'OK' : c.t };
const ROWNAV = { game: 'settings', store: 'settings', engine: 'system', ttw: 'mods', mods: 'mods', load: 'load', far: 'far', stab: 'mods' };
PAGES.home = () => {
  const p = P(), pl = U.play;
  let rows = homeRows(p), card = '', status, big;
  if (pl && pl.state === 'checking') {
    rows = pl.list.map((c, i) => i < pl.i ? shortRow(c, p) : i === pl.i ? { ...c, st: 'run', t: 'Checking…' } : { ...c, st: 'wait', t: 'Waiting' });
    status = 'Checking before play'; big = [stt('run', 'Checking your setup'), `Check ${Math.min(pl.i + 1, pl.list.length)} of ${pl.list.length}`];
    card = `<div class="card">${pbar((pl.i) / pl.list.length)}<div class="cca">${btn('Cancel', { k: 'ghost', act: 'playCancel', arg: '' })}</div></div>`;
  } else if (pl && pl.state === 'failed') {
    const bad = pl.list.filter(c => c.st === 'fail');
    status = 'Play stopped by a check'; rows = pl.list.map((c, i) => i <= pl.stopAt ? shortRow(c, p) : { ...c, st: 'wait', t: 'Not checked' });
    card = `<div class="card" role="alert"><div class="phdr" style="margin:0 0 10px;min-height:0">${ic('err', 24, 'errc')}<h2 style="margin:0;font-size:1.15rem">Play stopped: ${plural(bad.length, 'check')} failed</h2></div><div class="rows">${bad.map(c => `<div class="r"><span class="nm">${c.n}</span><span class="end">${tag(c.why, 'err', 'err')}</span></div>`).join('')}</div><div class="cca">${btn('Check again', { k: 'ghost', icon: 'refresh', act: 'play', arg: '' })}${btn(bad[0].fix[0], { k: 'primary', act: bad[0].fix[1], arg: bad[0].fix[2] })}</div></div>`;
    big = [stt('fail', 'Play stopped'), 'Fix the failed check'];
  } else if (pl && pl.state === 'warned') {
    const w = pl.list.filter(c => c.st === 'warn');
    status = 'Ready, with warnings'; rows = pl.list.map(c => shortRow(c, p));
    card = `<div class="card" role="alert"><div class="phdr" style="margin:0 0 10px;min-height:0">${ic('warn', 24, 'warnc')}<h2 style="margin:0;font-size:1.15rem">Before you play: ${plural(w.length, 'warning')}</h2></div><div class="rows">${w.map(c => `<div class="r"><span class="nm">${c.n}</span><span class="end">${tag(c.why, 'warn', 'warn')}${c.id === 'stab' && lastStable(p) ? btn('Revert to last stable', { k: 'sec', cls: 'sm', icon: 'undo', act: 'vRevertStable', arg: '' }) : ''}${btn(c.fix[0], { k: 'sec', cls: 'sm', act: c.fix[1], arg: c.fix[2] })}</span></div>`).join('')}</div><div class="cca">${btn('Cancel', { k: 'ghost', act: 'playCancel', arg: '' })}${btn('Play anyway', { k: 'primary', icon: 'play', act: 'playAnyway', arg: '' })}</div></div>`;
    big = [stt('warn', 'Ready, with warnings'), 'You can play, or fix these first'];
  } else if (U.run) { status = 'Playing'; big = [stt('ok', 'Playing'), `${esc(prof(U.run.pid).name)} · ${hm(Math.floor((Date.now() - U.run.start) / 1000))}`]; }
  else if (pl && pl.state === 'starting') { status = 'Starting'; big = [stt('run', 'Starting the game'), 'Loading your mods']; }
  else {
    const L = checks(p), f = L.filter(c => c.st === 'fail').length, w = L.filter(c => c.st === 'warn').length;
    status = f ? 'Needs attention' : w ? 'Ready, with warnings' : 'Ready to play';
    big = f ? [stt('fail', 'Needs attention'), 'Play checks first and shows the fix'] : w ? [stt('warn', 'Ready, with warnings'), 'Play shows them before it starts'] : [stt('ok', 'Ready to play'), 'All set. Go on, the Mojave’s waiting.'];
  }
  const tot = S.g.sessions.reduce((a, s) => a + s.mins, 0), last = S.g.sessions[S.g.sessions.length - 1];
  const listH = rows.map(c => `<div class="r click" role="button" tabindex="0" data-act="nav" data-arg="${ROWNAV[c.id]}" data-k="hrow:${c.id}"><span class="nm">${c.n}</span><span class="end">${c.st === 'fail' && c.why ? tag(c.why, 'err') : ''}${stt(c.st, c.t)}${ic('chev', 16, 'muted')}</span></div>`).join('');
  return pageWrap('home', hdr('home', 'Home', status) + card + recCard(p, 'home') +
    `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:260px"><div style="font-size:1.35rem;font-weight:700;margin-bottom:4px">${big[0]}</div><div class="muted">${big[1]}</div></div>
     <dl class="kv" style="grid-template-columns:auto auto;margin:0"><dt>Profile</dt><dd><span class="tag">${ic('user', 14)}${esc(p.name)}</span> ${stableChip(p)}</dd><dt>Last played</dt><dd>${last ? `${dayLabel(last.t)} · ${hm(last.mins)}` : 'Not yet'}</dd><dt>Playtime</dt><dd>${tot ? hm(tot) : '0 h'}</dd></dl></div>` +
    `<div class="sec">${sech('Setup')}<div class="rows">${listH}</div></div>`);
};

/* ---------- Mods ---------- */
PAGES.mods = () => {

A.modMove = a => { const [id, d] = a.split(':'); moveModBy(id, +d); };
function moveModBy(id, d) {
  const p = P(), list = modsInOrder(p), i = list.findIndex(m => m.id === id), j = i + d;

function dropMod(id, gid, k) {
  const p = P(); const cur = modsInOrder(p); const m0 = cur.find(x => x.id === id);

  const gname = p.groups.find(g => g.id === gid).name;
  change(m0.g === gid ? `Moved ${modName(id)}` : `Moved ${modName(id)} to ${gname}`, pp => {
    const l = modsInOrder(pp), m = l.find(x => x.id === id), rest = l.filter(x => x.id !== id), mem = rest.filter(x => x.g === gid);
    m.g = gid; let at;
    if (k < mem.length) at = rest.indexOf(mem[k]); else if (mem.length) at = rest.indexOf(mem[mem.length - 1]) + 1; else at = rest.length;

/* play */
let playT = null;
A.play = () => {
  if (U.run || (U.play && U.play.state === 'checking')) return;
  const list = checks(P()); U.play = { state: 'checking', i: 0, list }; nav('home');
  clearInterval(playT);
  playT = setInterval(() => {
    const pl = U.play; if (!pl || pl.state !== 'checking') { clearInterval(playT); return; }
    const c = pl.list[pl.i];
    if (c.st === 'fail') { pl.state = 'failed'; pl.stopAt = pl.i; clearInterval(playT); return render(); }
    pl.i++;
    if (pl.i >= pl.list.length) { clearInterval(playT); if (pl.list.some(x => x.st === 'warn')) pl.state = 'warned'; else startGame(); }
    render();
  }, 380);
};
A.playCancel = () => { clearInterval(playT); U.play = null; render(); };
A.playAnyway = () => startGame();
function startGame() { U.play = { state: 'starting' }; render(); setTimeout(() => { if (!U.play || U.play.state !== 'starting') return; U.play = null; U.run = { pid: S.active, start: Date.now() }; ensureTick(); toast('New Vegas is running'); render(); }, 1500); }
A.stopGame = () => { const r = U.run; if (!r) return; const mins = Math.max(1, Math.floor((Date.now() - r.start) / 1000)) / 60; S.g.sessions.push({ t: Date.now(), mins, pid: r.pid }); U.run = null; toast(`Played ${hm(mins)}. Added to your playtime`); commit(); };

}, { label: 'Looking for the folder' });
A.cleanCache = () => { if (S.g.cache < 0.1) { toast('The download cache is already empty'); return render(); } confirmDlg('Clean up the download cache?', `Frees ${S.g.cache.toFixed(1)} GB. These are archives of mods you already installed; you can download them again.`, 'Clean up', 'doClean'); };
A.doClean = () => { U.dlg = null; const c = S.g.cache; S.g.cache = 0; S.g.storeFree = Math.round(S.g.storeFree + c); toast(`Freed ${c.toFixed(1)} GB`); commit(); };
A.repairEngine = () => job('repair', 3000, () => { S.g.scen.engine = false; toast('Engine repaired'); commit(); }, { label: 'Repairing the engine' });

/* system */
function autoCheck() { if (S.g.autoCheck && Date.now() - S.g.lastCheck > 5 * 60000 && !J.check) A.checkUpdates(); }
A.checkUpdates = a => { if (a === 'go') { U.page = 'system'; U.scrollTop = true; } job('check', 1800, () => { S.g.lastCheck = Date.now(); commit(); }, { label: 'Checking for updates' }); };
A.update = () => { U.updErr = false; job('update', 7000, () => { S.g.tbVer = TB().nw; U.justUpdated = true; U.vopen = 'toolbox'; toast(`Updated to Raul's Toolbox ${TB().nw}`); commit(); }, { label: 'Updating', failAt: S.g.scen.dl ? 0.35 : null, fail: () => { U.updErr = true; toast('The download stopped'); render(); } }); };
A.useBuild = a => confirmDlg(`Use engine ${a}?`, `The game runs on ${a} from the next start. You can switch back here.`, `Use ${a}`, 'doUseBuild', a);
A.doUseBuild = a => { U.dlg = null; S.g.engine = a; toast(`Engine ${a} in use`); commit(); };
A.removeBuild = a => confirmDlg(`Remove engine ${a}?`, 'You can’t switch back to it after this.', 'Remove', 'doRemoveBuild', a, true);
A.doRemoveBuild = a => { U.dlg = null; S.g.builds = S.g.builds.filter(b => b !== a); toast(`Engine ${a} removed`); commit(); };
A.mlUpdate = () => job('ml', 2500, () => { S.g.mlAt = Date.now(); S.g.mlNew = ML_NEW; toast(`Masterlist updated: ${plural(ML_NEW, 'new message')}`); commit(); }, { label: 'Updating the masterlist' });
A.docRun = () => { S.g.docRun = Date.now(); job('doctor', 11 * 320, () => { commit(); }, { label: 'Doctor' }); };

/* settings */
IN.gfx = (v, el) => { P().gfx[el.dataset.id] = v; recordVersion(P()); toast(`Saved for ${P().name}`); commit(); };
A.gfxSeg = a => { const [k, v] = a.split(':'); P().gfx[k] = v; recordVersion(P()); commit(); };
A.gfxVsync = () => { P().gfx.vsync = !P().gfx.vsync; recordVersion(P()); commit(); };
A.gset = a => { if (a === 'motion') S.g.motion = !S.g.motion; else S.g[a] = !S.g[a]; commit(); };
A.resetAll = () => confirmDlg('Start setup again?', 'Raul’s Toolbox forgets every choice, profile change and test result, then runs setup from the start. Your game folder is not touched.', 'Start setup again', 'doReset', '', true);
A.doReset = () => { store.clear(); for (const k of Object.keys(J)) delete J[k]; S = fresh(); Object.assign(U, { page: 'home', dlg: null, menu: null, play: null, run: null, undo: {}, sortPrev: null, ttwFlow: null, open: {}, justUpdated: false, updErr: false }); commit(); };

/* wizard */
const W = () => S.wiz;
A.wizNext = () => { const w = W(); w.step = Math.min(WSTEPS.length - 1, w.step + 1); wizEnter(); U.focus = null; commit(); };
A.wizBack = () => { W().step = Math.max(0, W().step - 1); commit(); };
function wizEnter() {
  const w = W();
  if (w.step === 1 && !w.game && !J['find:wfnv']) A.findFolder('wfnv');
  if (w.step === 2 && !w.store) { const f = FOLDERS.store[1]; w.store = { path: f[1], free: S.g.scen.disk ? 11 : f[3] }; }
  if (w.step === 4 && !w.fo3 && !J['find:wfo3']) A.findFolder('wfo3');
  if (w.step === 6 && w.prof !== 'empty' && !w.qSet) { w.q = SEED.find(x => x.id === w.prof).q; }
}
A.wizEngine = () => { U.wEngErr = false; job('wengine', 4200, () => { W().engine = true; commit(); }, { label: 'Installing the engine', failAt: S.g.scen.dl ? 0.4 : null, fail: () => { U.wEngErr = true; render(); } }); };
A.wizTtw = a => { const w = W(); if (a === 'skip') w.ttw = 'skipped'; if (a === 'undo') w.ttw = null; if (a === 'add') { if (!ttwRoom(W().store ? W().store.free : 0)) return; job('wttw', 6000, () => { W().ttw = 'added'; commit(); }, { label: 'Installing TTW' }); return; } commit(); };
A.wizProf = a => { W().prof = a; W().qSet = false; U.focus = 'wizProf:' + a; commit(); };
A.wizQ = a => { W().q = a; W().qSet = true; commit(); };
A.wizFar = a => { const w = W(); if (a === 'later') w.far = 'later'; if (a === 'undo') w.far = null; if (a === 'build') { job('wfar', 6000, () => { W().far = 'built'; commit(); }, { label: 'Building LOD' }); return; } commit(); };
A.wizFinish = () => {
  const w = W(), g = S.g;
  g.gamePath = w.game.path; g.gameOk = true; g.storePath = w.store.path; g.storeFree = w.store.free; g.ttwInstalled = w.ttw === 'added'; g.fo3Path = w.fo3 && w.fo3.ok ? w.fo3.path : null;
  if (w.prof === 'empty') { const np = emptyProfile('My profile'); ensureVersions(np); S.profiles.push(np); S.active = np.id; } else S.active = w.prof;
  const p = P(); p.far.q = w.q;
  if (w.far === 'built') p.far.built = { sig: farSig(p), q: p.far.q, fine: null, t: Date.now(), size: +farSize(p).toFixed(1), n: p.mods.filter(m => m.on).length };
  w.done = true; U.page = 'home'; U.scrollTop = true;
  toast(`Welcome in. ${p.name} is your profile`);
  commit();
};

/* test situations panel */
A.scenClose = () => { U.scen = false; render(); };
A.scen = a => { const s = S.g.scen; s[a] = !s[a]; if (a === 'disk') { if (s.disk) { S.g.storeFreeWas = S.g.storeFree; S.g.storeFree = 11; } else S.g.storeFree = S.g.storeFreeWas || 142; } if (a === 'game' && !s.game) S.g.gameOk = !!S.g.gamePath || S.g.gameOk; U.focus = 'scen:' + a; commit(); };
A.scenHistory = () => { const now = Date.now(); const ids = S.profiles.map(p => p.id); [[9, 134], [6, 88], [4, 41], [2, 152], [1, 74]].forEach(([d, m], i) => S.g.sessions.push({ t: now - d * DAY, mins: m, pid: ids[i % ids.length] })); S.g.sessions.sort((a, b) => a.t - b.t); toast('Play history added'); commit(); };
A.scenTtwUpd = () => { S.g.ttwUpdate = true; toast('TTW reports an update'); commit(); };

/* dispatch */
function run(act, arg, el, ev) { if (A[act]) A[act](arg, el, ev); }
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (U.menu && !ev.target.closest('.menu') && !(el && el.dataset.k === U.menu.anchor)) { U.menu = null; if (!el) return render(); }
  if (!el || el.disabled) return;
  /* whole-row actions: nested form fields and drag handles keep their own behaviour */
  if (ev.target.closest('[data-grip]')) return;
  const fld = ev.target.closest('input,select,textarea,label'); if (fld && el.contains(fld) && fld !== el) return;
  if (el.dataset.act === 'scrim' && ev.target !== el) return;
  if (el.closest('.menu')) U.menu = null;
  run(el.dataset.act, el.dataset.arg, el, ev);
});
document.addEventListener('input', ev => { const el = ev.target; if (el.dataset && el.dataset.in && el.tagName !== 'SELECT') { if (IN[el.dataset.in]) IN[el.dataset.in](el.value, el); else { U[el.dataset.in] = el.value; render(); } } });
document.addEventListener('change', ev => { const el = ev.target; if (el.tagName === 'SELECT' && el.dataset.in && IN[el.dataset.in]) IN[el.dataset.in](el.value, el); });
IN.palQ = v => { if (!U.pal) return; U.pal.q = v; U.pal.i = 0; render(); };
IN.q = v => { U.q = v; render(); };
IN.lq = v => { U.lq = v; render(); };

function afterDraw() {
  if (U.picSeen !== U.picPlace + U.picWorld) { const st = document.querySelector('.places.strip'), b = st && st.querySelector('[aria-pressed="true"]'); if (b) { U.picSeen = U.picPlace + U.picWorld; const l = b.offsetLeft - st.offsetLeft; if (l < st.scrollLeft || l + b.offsetWidth > st.scrollLeft + st.clientWidth) st.scrollLeft = l - 24; } }
  if (U.dlgFresh) { U.dlgFresh = false; const d = document.querySelector('.dlg'); if (d) { const f = ['input', '[aria-selected="true"]', '.picker [tabindex="0"]', '.opt', '[data-k="dlgok"]', '.cca .btn.primary:not(:disabled)', '.cca .btn.dangerp', '.btn'].map(q => d.querySelector(q)).find(Boolean); if (f) f.focus(); } }
}

/* keyboard */
document.addEventListener('keydown', ev => {
  const k = ev.key, t = ev.target, typing = t.tagName === 'INPUT' || t.tagName === 'SELECT';
  if (ev.ctrlKey && ev.shiftKey && (k === 'D' || k === 'd')) { ev.preventDefault(); U.scen = !U.scen; return render(); }
  if (ev.ctrlKey && (k === 'k' || k === 'K')) { ev.preventDefault(); if (S.wiz.done) U.pal ? (U.pal = null, render()) : A.palette(); return; }
  if (k === 'Escape') {
    if (U.menu) { const a = U.menu.anchor; U.menu = null; U.focus = a; return render(); }
    if (U.pal) { U.pal = null; U.focus = U.ret; return render(); }
    if (U.dlg) { if (!(U.dlg.t === 'install' && U.dlg.step === 'busy')) closeDlg(); return; }
    if (U.scen) { U.scen = false; return render(); }
    if (U.drag) { U.drag = null; return render(); }
  }
  if (U.pal) {
    const n = palItems().length;
    if (k === 'ArrowDown') { ev.preventDefault(); U.pal.i = (U.pal.i + 1) % Math.max(1, n); return render(); }
    if (k === 'ArrowUp') { ev.preventDefault(); U.pal.i = (U.pal.i - 1 + n) % Math.max(1, n); return render(); }
    if (k === 'Enter') { ev.preventDefault(); return A.palGo(U.pal.i); }
  }
  if (U.menu && (k === 'ArrowDown' || k === 'ArrowUp' || k === 'Home' || k === 'End')) {
    ev.preventDefault(); const items = [...document.querySelectorAll('.menu .mi:not(:disabled)')]; const i = items.indexOf(document.activeElement);
    const j = k === 'Home' ? 0 : k === 'End' ? items.length - 1 : (i + (k === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items[j] && items[j].focus(); return;
  }
  if (U.menu && k === 'Tab') { U.menu = null; render(); }
  if (k === 'Tab' && (U.dlg || U.pal)) {
    const box = document.querySelector('.dlg'); if (!box) return; const f = [...box.querySelectorAll('button:not(:disabled),input,select,[tabindex="0"]')]; if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (ev.shiftKey && (i <= 0)) { ev.preventDefault(); f[f.length - 1].focus(); } else if (!ev.shiftKey && (i === f.length - 1 || i < 0)) { ev.preventDefault(); f[0].focus(); }
    return;
  }
  if ((k === 'ArrowDown' || k === 'ArrowUp') && t.closest && t.closest('.picker') && t.getAttribute('role') === 'option') { ev.preventDefault(); const opts = [...t.closest('.picker').querySelectorAll('[role="option"][tabindex="0"]')]; const none = !t.closest('.picker').querySelector('[aria-selected="true"]'); const i = none && k === 'ArrowDown' ? -1 : opts.indexOf(t); const n = opts[i + (k === 'ArrowDown' ? 1 : -1)]; if (n) { n.click(); n.focus(); } return; }
  /* Enter is the dialog's primary action (Space still picks an option; a focused plain button keeps its own Enter) */
  if (k === 'Enter' && U.dlg && !ev.shiftKey && t.tagName !== 'TEXTAREA') {
    const box = document.querySelector('.dlg');
    if (box && box.contains(t)) {
      const plainBtn = t.tagName === 'BUTTON' && !t.getAttribute('role');
      if (!plainBtn) {
        ev.preventDefault();
        if (U.dlg.t === 'name') { A.nameOk(); return; }
        if ((t.getAttribute('role') === 'option') && t.dataset.act) t.click();
        const go = () => { const p = [...document.querySelectorAll('.dlg .cca .btn.primary:not(:disabled), .dlg .cca .btn.dangerp:not(:disabled)')].pop(); if (p) p.click(); };
        if (t.getAttribute('role') === 'option') requestAnimationFrame(() => requestAnimationFrame(go)); else go();
        return;
      }
    }
  }
  if (ev.altKey && (k === 'ArrowUp' || k === 'ArrowDown') && t.dataset && t.dataset.move) {
    ev.preventDefault(); const d = k === 'ArrowUp' ? -1 : 1;
    if (t.dataset.move === 'mod') moveModBy(t.dataset.k.slice(4), d);
    if (t.dataset.move === 'group') { const id = t.dataset.k.slice(4); moveGroup(id, P().groups.findIndex(g => g.id === id) + d); U.focus = 'grp:' + id; }
    if (t.dataset.move === 'plugin' && !U.sortPrev) { const f = t.dataset.id; movePlugin(f, visPlugins(P()).map(x => x.f).indexOf(f) + d); }
    return;
  }
  if ((k === 'Enter' || k === ' ') && t.getAttribute && t.getAttribute('role') !== null && t.tagName !== 'BUTTON' && t.dataset && t.dataset.act) { ev.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  if (k === '?' && !typing && !U.dlg && S.wiz.done) { ev.preventDefault(); A.shortcuts(); }
});

/* drag: pointer events, a lifted ghost and a drop line; Alt+Up/Down does the same from the keyboard */
document.addEventListener('pointerdown', ev => {
  const g = ev.target.closest('[data-grip]'); if (!g || ev.button !== 0 || U.sortPrev) return;
  ev.preventDefault();
  U.drag = { kind: g.dataset.grip, id: g.dataset.id, sx: ev.clientX, sy: ev.clientY, x: ev.clientX, y: ev.clientY, moved: false };
});
document.addEventListener('pointermove', ev => {
  const D = U.drag; if (!D) return;
  D.x = ev.clientX; D.y = ev.clientY;
  if (!D.moved && Math.hypot(D.x - D.sx, D.y - D.sy) < 5) return;
  D.moved = true;
  if (D.kind === 'mod') {
    const els = document.elementsFromPoint(D.x, D.y); const card = els.map(e => e.closest && e.closest('[data-groupcard]')).find(Boolean);
    if (card) { D.toG = card.dataset.groupcard; const rows = [...card.querySelectorAll('.mrow[data-mod]')].filter(r => r.dataset.mod !== D.id); D.toI = rows.filter(r => { const b = r.getBoundingClientRect(); return b.top + b.height / 2 < D.y; }).length; }
  } else if (D.kind === 'group') {
    const cards = [...document.querySelectorAll('[data-groupcard]')].filter(c => c.dataset.groupcard !== D.id);
    D.to = cards.filter(c => { const b = c.getBoundingClientRect(); return b.top + Math.min(b.height / 2, 40) < D.y; }).length;
  } else if (D.kind === 'plugin') {
    const rows = [...document.querySelectorAll('.mrow[data-plugin]')].filter(r => r.dataset.plugin !== D.id);
    D.to = rows.filter(r => { const b = r.getBoundingClientRect(); return b.top + b.height / 2 < D.y; }).length;
  }
  const sc = document.querySelector('.mscroll'); if (sc) { const b = sc.getBoundingClientRect(); if (D.y < b.top + 24) sc.scrollTop -= 10; if (D.y > b.bottom - 24) sc.scrollTop += 10; }
  render();
});
document.addEventListener('pointerup', () => {
  const D = U.drag; if (!D) return; U.drag = null;
  if (!D.moved) return render();
  if (D.kind === 'mod' && D.toG) dropMod(D.id, D.toG, D.toI);
  else if (D.kind === 'group' && D.to != null) moveGroup(D.id, D.to);
  else if (D.kind === 'plugin' && D.to != null) movePlugin(D.id, D.to);
  else render();
});

/* versions: revert or pick a later one; the list stays */
A.vexp = a => { U.vexp = U.vexp === a ? null : a; render(); };
A.vRevert = a => {
  U.menu = null; const p = P(), v = p.versions.find(x => x.id === a), cur = p.versions.find(x => x.id === p.cur);
  const later = cur && v.t > cur.t;
  confirmDlg(later ? `Go to the version from ${vLabel(v.t)}?` : `Revert to the version from ${vLabel(v.t)}?`, `Mods, order and game settings become “${esc(v.summary)}” again. Other versions stay in the list.`, later ? 'Use this version' : 'Revert', 'doRevert', a);
};
A.vRevertStable = () => { const v = lastStable(P()); if (v) A.vRevert(v.id); };
A.doRevert = a => {
  U.dlg = null; const p = P(), v = p.versions.find(x => x.id === a);
  applySnap(p, v.snap); p.cur = v.id; U.undo[p.id] = []; U.sortPrev = null;
  toast(`Now on the version from ${vLabel(v.t)}`); commit();
};
A.ptMenu = a => { const anchor = 'pt:' + a; U.menu = U.menu && U.menu.anchor === anchor ? null : { id: 'pt', run: +a, anchor, fresh: true }; render(); };

/* start */
A.quitAsk = () => confirmDlg('Quit Raul’s Toolbox?', 'Running jobs stop. Your setup is saved.', 'Quit', 'quitDo', '');
A.quitDo = () => { U.dlg = null; U.pal = null; U.menu = null; U.quit = true; render(); };
A.reopen = () => location.reload();
document.getElementById('tbi').innerHTML = ic('app', 16);
fitWin();
S = store.load();
if (!S || S.v !== 1) S = fresh();
S.profiles.forEach(ensureVersions);
if (S.wiz.done && S.g.autoCheck && U.page === 'system') autoCheck();
if (!S.wiz.done) wizEnter();
render();

</script>
</body>
