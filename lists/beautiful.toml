description = "Tale of Two Wastelands with the Wasteland Survival Guide set and the Beautiful 3c look: NMC textures, Nutscapes land, Natural Waters, Strip lighting, flora, NASA stars, Lucky 38 interior and exterior, lamp glow and a generated LOD."
