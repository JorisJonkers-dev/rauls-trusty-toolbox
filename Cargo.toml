# The umbrella workspace (docs/PLAN.md section 4.3). Components are submodules under components/ with their own
# workspaces, so they are excluded here and used by path; Cargo finds each one's own workspace root for `workspace =
# true` inheritance. crates/raul-gui is a nested workspace with its own lock file (ADR-0004).
[workspace]
resolver = "3"
members = ["crates/raul-core", "crates/raul-cli", "crates/raul-bench", "crates/raul-runner"]
exclude = ["components", "crates/raul-gui", "tools"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/JorisJonkers-dev/rauls-trusty-toolbox"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
raul-core = { path = "crates/raul-core" }
raul-bench = { path = "crates/raul-bench" }
raul-runner = { path = "crates/raul-runner" }
# The same source and tag nvmod v0.6.0 links, so Cargo builds one copy (known-good.toml checks the version).
loot-rs = { git = "https://github.com/JorisJonkers-dev/loot-rs", tag = "v0.5.0" }
nvmod-cli = { path = "components/nvmod-rs/crates/nvmod-cli" }
nvmod-core = { path = "components/nvmod-rs/crates/nvmod-core" }
nvmod-instance = { path = "components/nvmod-rs/crates/nvmod-instance" }
nvmod-pe = { path = "components/nvmod-rs/crates/nvmod-pe" }
nvmod-runlog = { path = "components/nvmod-rs/crates/nvmod-runlog" }
nvmod-testkit = { path = "components/nvmod-rs/crates/nvmod-testkit" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
