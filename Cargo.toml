# The umbrella workspace (docs/PLAN.md section 4.3). Components are submodules under components/ with their own
# workspaces, so they are excluded here and used by path; Cargo finds each one's own workspace root for `workspace =
# true` inheritance. crates/raul-gui is a nested workspace with its own lock file (ADR-0004).
[workspace]
resolver = "3"
members = ["crates/raul-core", "crates/raul-cli", "crates/raul-bench", "crates/raul-runner", "crates/raul-drivers"]
exclude = ["components", "crates/raul-gui", "tools"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/JorisJonkers-dev/rauls-trusty-toolbox"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
raul-core = { path = "crates/raul-core" }
raul-bench = { path = "crates/raul-bench" }
raul-runner = { path = "crates/raul-runner" }
raul-drivers = { path = "crates/raul-drivers" }
# The same source and tag nvmod v0.8.1 links, so Cargo builds one copy (the lock file fixes the version).
loot-rs = { git = "https://github.com/JorisJonkers-dev/loot-rs", tag = "v0.6.3" }
nvmod-api = { path = "components/nvmod-rs/crates/nvmod-api" }
nvmod-cli = { path = "components/nvmod-rs/crates/nvmod-cli" }
nvmod-core = { path = "components/nvmod-rs/crates/nvmod-core" }
nvmod-install = { path = "components/nvmod-rs/crates/nvmod-install" }
nvmod-instance = { path = "components/nvmod-rs/crates/nvmod-instance" }
nvmod-loadorder = { path = "components/nvmod-rs/crates/nvmod-loadorder" }
nvmod-modinstall = { path = "components/nvmod-rs/crates/nvmod-modinstall" }
nvmod-pe = { path = "components/nvmod-rs/crates/nvmod-pe" }
nvmod-run = { path = "components/nvmod-rs/crates/nvmod-run" }
nvmod-runlog = { path = "components/nvmod-rs/crates/nvmod-runlog" }
nvmod-testkit = { path = "components/nvmod-rs/crates/nvmod-testkit" }
ttwright-core = { path = "components/ttwright-rs/crates/ttwright-core" }
ttwright-contract = { path = "components/ttwright-rs/crates/ttwright-contract" }
ttwright-testkit = { path = "components/ttwright-rs/crates/ttwright-testkit" }
lodwright-api = { path = "components/lodwright-rs/crates/lodwright-api" }
lodwright-contract = { path = "components/lodwright-rs/crates/lodwright-contract" }
lodwright-testkit = { path = "components/lodwright-rs/crates/lodwright-testkit" }
jsonschema = { version = "=0.61.2", default-features = false }
schemars = { version = "=1.2.3", features = ["derive"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
toml = "=1.2.1+spec-1.1.0"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
