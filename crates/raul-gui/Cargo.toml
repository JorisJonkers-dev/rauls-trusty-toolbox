# The GUI workspace (ADR-0004): its own workspace root with its own Cargo.lock and deny file, so the GUI's
# dependencies never enter the umbrella workspace's lock. It uses the umbrella's raul-cli and raul-runner, and the
# nvmod crates under components/, by path. Its root package builds the release `raul`: the same command line as the
# umbrella's, plus the egui shell when it is started with no arguments (ADR-0004, ADR-0012).
[workspace]
resolver = "3"
members = [".", "crates/raul-engine", "crates/raul-ui-model", "crates/raul-ui-service"]

[package]
name = "raul-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The release `raul`: the Toolbox command line, and the egui shell when it is started with no arguments."

[lib]
name = "raul_gui"
path = "src/lib.rs"

[[bin]]
name = "raul"
path = "src/main.rs"

[dependencies]
raul-cli = { workspace = true }
raul-core = { workspace = true }
raul-drivers = { workspace = true }
nvmod-modinstall = { workspace = true }
nvmod-run = { workspace = true }
raul-ui-model = { workspace = true }
raul-ui-service = { workspace = true }
eframe = { workspace = true }
serde_json = { workspace = true }
raul-engine = { workspace = true }
raul-runner = { workspace = true }

[features]
default = []
# The engine's crates linked in process (ADR-0016): on in release builds, off in the fast loops and workspace-wide CI.
engine = ["raul-engine/engine"]

[dev-dependencies]
nvmod-api = { workspace = true }
egui_kittest = { workspace = true }
nvmod-testkit = { workspace = true }
ttwright-testkit = { path = "../../components/ttwright-rs/crates/ttwright-testkit" }
lodwright-testkit = { path = "../../components/lodwright-rs/crates/lodwright-testkit" }

[lints]
workspace = true

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/JorisJonkers-dev/rauls-trusty-toolbox"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
raul-ui-model = { path = "crates/raul-ui-model" }
raul-ui-service = { path = "crates/raul-ui-service" }
raul-engine = { path = "crates/raul-engine" }
# The engine's crates, by path through the submodule (ADR-0017): the pin is the submodule pointer and the lock file.
fork-api = { path = "../../components/nv-rs/crates/fork-api" }
fork-play = { path = "../../components/nv-rs/crates/fork-play" }
raul-cli = { path = "../raul-cli" }
raul-runner = { path = "../raul-runner" }
nvmod-api = { path = "../../components/nvmod-rs/crates/nvmod-api" }
nvmod-loadorder = { path = "../../components/nvmod-rs/crates/nvmod-loadorder" }
raul-core = { path = "../raul-core" }
raul-drivers = { path = "../raul-drivers" }
nvmod-core = { path = "../../components/nvmod-rs/crates/nvmod-core" }
nvmod-testkit = { path = "../../components/nvmod-rs/crates/nvmod-testkit" }
nvmod-modinstall = { path = "../../components/nvmod-rs/crates/nvmod-modinstall" }
nvmod-backup = { path = "../../components/nvmod-rs/crates/nvmod-backup" }
nvmod-instance = { path = "../../components/nvmod-rs/crates/nvmod-instance" }
nvmod-tools = { path = "../../components/nvmod-rs/crates/nvmod-tools" }
nvmod-run = { path = "../../components/nvmod-rs/crates/nvmod-run" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The toolkit (ADR-0012): glow renders with OpenGL, which software rendering covers on a machine with no GPU.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
# Headless page tests; snapshots render through wgpu, on a software adapter in CI.
egui_kittest = { version = "=0.37.0", features = ["eframe", "snapshot", "wgpu"] }

# Cargo reads [patch] and [profile] from the root of the build only, so the settings of nv-rs's root Cargo.toml that
# the engine needs are repeated here; scripts/check-component-locks keeps them equal. wgpu-hal is nv-rs's vendored
# 30.0.1 (Vulkan pipeline-library work); without it the engine would run on the published crate.
[patch.crates-io]
wgpu-hal = { path = "../../components/nv-rs/vendor/wgpu-hal" }

# The translated core as one code-generation unit, as nv-rs builds its release.
[profile.release.package.engine-core]
codegen-units = 1

[profile.release.package.engine-platform]
codegen-units = 1
