[package]
name = "raul-ui-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The service seam of the Toolbox GUI: a trait whose real implementation runs `raul` through the streaming Runner and parses its --json output, a scripted fake, and the registry that ties every GUI action to a command line equivalent."

[dependencies]
nvmod-api = { workspace = true }
nvmod-loadorder = { workspace = true }
nvmod-backup = { workspace = true }
nvmod-core = { workspace = true }
nvmod-instance = { workspace = true }
raul-core = { workspace = true }
raul-drivers = { workspace = true }
raul-cli = { workspace = true }
raul-ui-model = { workspace = true }
raul-runner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nvmod-testkit = { workspace = true }
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["compress"] }
ttwright-testkit = { path = "../../../../components/ttwright-rs/crates/ttwright-testkit" }
lodwright-testkit = { path = "../../../../components/lodwright-rs/crates/lodwright-testkit" }

[lints]
workspace = true
