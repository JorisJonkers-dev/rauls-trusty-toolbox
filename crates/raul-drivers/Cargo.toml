[package]
name = "raul-drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Drivers of the process Components (TTW through ttwright, LOD through lodwright, both linked in process) and the raul-events stream."

[dependencies]
nvmod-core = { workspace = true }
nvmod-formats = { workspace = true }
nvmod-instance = { workspace = true }
nvmod-loadorder = { workspace = true }
nvmod-modinstall = { workspace = true }
nvmod-runlog = { workspace = true }
ttwright-core = { workspace = true }
ttwright-contract = { workspace = true }
lodwright-api = { workspace = true }
lodwright-contract = { workspace = true }
jsonschema = { workspace = true }
# The same versions nvmod-modinstall links, so Cargo builds one copy: only the list of names of an archive is read here
# (the TTW package is found by what its archive holds); unpacking is nvmod's extractor.
sevenz-rust2 = { version = "=0.25.0", default-features = false }
zip = { version = "=9.6.1", default-features = false }
toml = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["compress"] }
nvmod-testkit = { workspace = true }
lodwright-testkit = { workspace = true }

[lints]
workspace = true
