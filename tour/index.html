<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guided tour · Raul's Toolbox</title>
<meta name="description" content="Ten short steps through the clickable demo of Raul's Toolbox. Each step ticks itself off when you do it.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23F59E3B%27 stroke-width=%271.8%27 stroke-linecap=%27round%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%273.2%27/%3E%3Cpath d=%27M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/site.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.tourwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px}
.stage{position:relative;justify-self:center;align-self:center;width:min(100%,calc((100vh - 110px) * 1312 / 752));aspect-ratio:1312/752;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#07080A}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07080A}
#ring{position:absolute;pointer-events:none;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 4px rgba(61,214,198,.25),0 0 24px rgba(61,214,198,.5);animation:pulse 1.4s ease-in-out infinite;display:none;z-index:5}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(61,214,198,.12),0 0 32px rgba(61,214,198,.7)}}
@media (prefers-reduced-motion:reduce){#ring{animation:none}}
.panel{align-self:stretch;max-height:calc(100vh - 110px);min-height:0;display:flex;flex-direction:column;background:var(--raise);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.phead{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.phead h1{margin:0 0 4px;font-size:1.2rem}
.phead p{margin:0;color:var(--muted);font-size:.9rem}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.88rem;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
ol.steps{list-style:none;margin:0;padding:8px;overflow:auto;flex:1}
.step{border-radius:10px;border:1px solid transparent}
.step.cur{background:var(--sel);border-color:var(--line)}
.step>button.head{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:10px 12px;cursor:pointer;border-radius:10px}
.step>button.head:hover{background:var(--hover)}
.tick{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ctl,#7A848F);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:var(--on-accent);margin-top:1px}
.step[data-done="true"] .tick{background:var(--ok);border-color:var(--ok)}
.step[data-done="true"] .t{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(163,172,183,.5)}
.t{font-weight:600}
.body{padding:0 12px 12px 46px;color:var(--muted);font-size:.92rem}
.body[hidden]{display:none}
.body p{margin:0 0 10px}
.panel footer{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.done{margin:8px;padding:12px 14px;border-radius:10px;background:rgba(76,195,138,.12);border:1px solid var(--ok);color:var(--text);font-size:.92rem}
.done[hidden]{display:none}
@media (max-width:900px){
  body{overflow:auto}
  .tourwrap{grid-template-columns:1fr;grid-template-rows:auto auto}
  .stage{width:100%}
  .panel{max-height:none}
}
</style>
</head>
<body>
<header class="top"><a class="brand" href="../index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>Raul's Toolbox</a><nav aria-label="Site"><a href="../demo/">Demo</a><a href="../tour/" aria-current="page">Guided tour</a><a href="../wiki/">Wiki</a><a href="../bench/">Benchmarks</a><a href="https://github.com/JorisJonkers-dev/rauls-trusty-toolbox">GitHub</a></nav></header>
<div class="tourwrap">
<div class="stage">
<iframe id="demo" src="../demo/" title="Raul's Toolbox clickable demo"></iframe>
<div id="ring" role="presentation"></div>
</div>
<section class="panel" aria-label="Guided tour">
<div class="phead">
<h1>Guided tour</h1>
<p>Do each step in the demo on the left. It ticks itself off. The demo uses made-up data and keeps its state in your browser only.</p>
<div class="prog"><div class="bar" aria-hidden="true"><i id="barfill"></i></div><span id="count" role="status" aria-live="polite">0 of 10</span></div>
</div>
<ol class="steps" id="steps"></ol>
<div class="done" id="finished" hidden>All steps done. Open the <a href="../wiki/">wiki</a> to read more about each page.</div>
<footer>
<button class="btn sm ghost" id="hide" type="button">Hide highlight</button>
<span style="display:flex;gap:8px"><a class="btn sm ghost" href="../demo/">Open demo alone</a><button class="btn sm" id="reset" type="button">Reset</button></span>
</footer>
</section>
</div>
<script src="tour.js"></script>
</body>
</html>
