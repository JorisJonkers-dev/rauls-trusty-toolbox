# Benchmarks (docs/PLAN.md, Phase 4; decision 12). On a pull request labelled `bench` it runs `raul bench` on main
# and on the head in the same job, so both numbers come from one machine, and posts the comparison as a comment.
# On main it adds the run to the history on the gh-pages branch (github-action-benchmark). Shared runners are
# noisy, so a slower case is a warning in the comment and in the history, never a failed check.
#
# This is the one workflow that reacts to a label: adding `bench` is how a person asks for a run. It is not a
# required check and does not touch CI. On a pull request from a fork the token cannot comment; the comparison is
# then only in the job log.
name: Bench

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  compare:
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'bench' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          submodules: recursive
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            base
            head
      - name: Bench main
        working-directory: base
        run: cargo run --release --locked -p raul-cli -- bench --out "$RUNNER_TEMP/base"
      - name: Bench head
        working-directory: head
        run: cargo run --release --locked -p raul-cli -- bench --out "$RUNNER_TEMP/head"
      - name: Compare
        working-directory: head
        run: |
          {
            echo "## raul bench: main vs this pull request"
            echo
            cargo run --release --locked -p raul-cli -- bench compare "$RUNNER_TEMP/base/bench.json" "$RUNNER_TEMP/head/bench.json" --threshold 10
            echo
            echo "<details><summary>Full report (head)</summary>"
            echo
            cat "$RUNNER_TEMP/head/bench.md"
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/comment.md"
      - name: Post the comparison
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

  history:
    # Only main writes the history, so a dispatch from a feature branch cannot skew the baseline.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Bench
        run: cargo run --release --locked -p raul-cli -- bench --out "$RUNNER_TEMP/bench"
      - name: Convert for github-action-benchmark
        run: |
          jq '[.results[] | {name, unit: "ms", value: .median_ms}]' "$RUNNER_TEMP/bench/bench.json" > "$RUNNER_TEMP/history.json"
      - name: Move the raw chart page to bench/raw/ (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/pages"
          sh site/bench-migrate.sh "$RUNNER_TEMP/pages"
          cd "$RUNNER_TEMP/pages"
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(bench): move the raw benchmark page to bench/raw"
            git push origin HEAD:gh-pages
          fi
      - uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: raul bench
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/history.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench/raw
          github-token: ${{ github.token }}
          auto-push: true
          alert-threshold: "125%"
          comment-on-alert: false
          fail-on-alert: false
      - name: Publish the run as a site record
        # The site's /bench/ pages read bench/results/<project>/*.json from gh-pages (format: docs/wiki/benchmarks.md).
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          date_utc=$(date -u +%Y-%m-%d)
          jq --arg date "$date_utc" --arg sha "${SHA::7}" --arg repo "$GITHUB_REPOSITORY" '{
            schema: "toolbox-bench/1", project: "toolbox",
            run: {id: "raul-bench", date: $date, commit: $sha, version: ("raul " + .raul),
                  machine: ("GitHub-hosted ubuntu-latest runner, " + .os + " " + .arch + " (shared, so noisy)"),
                  method: "raul bench on synthetic fixtures (no game data): median wall time of the timed runs of each case.",
                  source: ("https://github.com/" + $repo + "/blob/main/docs/BENCHMARKS.md")},
            groups: [{id: "cases", title: "The raul bench suite", metric: "Median wall time of one run", unit: "ms", better: "lower",
                      series: [{id: "ours", label: "raul", role: "ours"}],
                      cases: [.results[] | {name, values: {ours: .median_ms}}]}],
            pending: []}' "$RUNNER_TEMP/bench/bench.json" > "$RUNNER_TEMP/record.json"
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/results"
          cd "$RUNNER_TEMP/results"
          mkdir -p bench/results/toolbox
          cp "$RUNNER_TEMP/record.json" "bench/results/toolbox/${date_utc}-${SHA::7}.json"
          git add bench/results
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(bench): record the run of ${SHA::7} for the site"
          for _ in 1 2 3 4 5; do
            git push origin HEAD:gh-pages && exit 0
            git pull --rebase origin gh-pages
          done
          exit 1
