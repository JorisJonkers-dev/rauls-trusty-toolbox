# The GUI workspace (crates/raul-gui, ADR-0004) has its own lock file, so ci.yml's workspace jobs never see it.
# This workflow runs its checks as two parallel jobs: lint (format, lint, doc tests, a headless start of the `raul`
# window (#16), licences and advisories) and test (tests with the 70% changed-line coverage gate, docs/COVERAGE.md,
# and the page snapshots). There is no GPU: snapshots render on Mesa's software Vulkan (lavapipe) and the window
# opens under Xvfb on Mesa's software OpenGL (llvmpipe).
name: GUI

# Called by ci.yml on every pull request that changes code and every push to main, so Pipeline Complete gates on it.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: gui-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  MESA_PACKAGES: mesa-vulkan-drivers libgl1-mesa-dri libegl1 xvfb libxkbcommon-x11-0

jobs:
  lint:
    name: GUI workspace lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/raul-gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          workspaces: crates/raul-gui -> target

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Doc tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --locked

      # `raul` with no arguments opens the window; RAUL_GUI_SMOKE closes it after its first frames.
      - name: Headless start of the GUI
        if: ${{ !cancelled() }}
        env:
          RAUL_GUI_SMOKE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y -qq $MESA_PACKAGES
          cargo build --locked --bin raul
          out=$(timeout 120 xvfb-run -a target/debug/raul)
          echo "$out"
          test "$out" = "raul: the window opened and closed"
          target/debug/raul --version

      # --all-features: the engine's closure sits behind the feature `engine` and must be checked as well.
      - name: Licences, bans, sources and advisories
        if: ${{ !cancelled() }}
        run: mise exec -- cargo deny --locked --all-features check

      - name: GPL-3.0-or-later only under components/nv-rs
        if: ${{ !cancelled() }}
        run: |
          ../../scripts/check-gpl-scope.sh --self-test
          ../../scripts/check-gpl-scope.sh

      - name: Advisories (cargo audit)
        if: ${{ !cancelled() }}
        run: mise exec -- cargo audit

  test:
    name: GUI workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: crates/raul-gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          workspaces: crates/raul-gui -> target

      - name: Software rendering
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y -qq $MESA_PACKAGES

      # The snapshot tests are among them; a changed picture fails and leaves .new.png and .diff.png files.
      - name: Tests with coverage
        id: tests
        env:
          # The ci profile of this workspace's .config/nextest.toml: no retries and a JUnit file for the feature catalogue.
          NEXTEST_PROFILE: ci
        run: mise exec -- cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info
      - name: Keep the JUnit results
        if: ${{ !cancelled() }}
        run: ../../scripts/ci/keep-junit.sh junit-linux-gui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: junit-linux-gui
          path: ${{ runner.temp }}/junit/junit-linux-gui.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Snapshot differences
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-differences
          path: |
            crates/raul-gui/tests/snapshots/**/*.new.png
            crates/raul-gui/tests/snapshots/**/*.diff.png
          if-no-files-found: ignore

      - name: Changed-line coverage gate (70%)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ../../scripts/ci/coverage-gate.sh lcov.info
