# Tag -> release flow (org standard), plus the installers of docs/PLAN.md Phase 5.
#
# release-please maintains a release PR from Conventional Commits; merging it tags vX.Y.Z and creates the GitHub
# Release. The build jobs then make the installers for Linux, Windows and macOS (packaging/README.md), each with
# the Component programs the submodules pin (ADR-0005), smoke-test them, and the publish job attaches
# them with SHA256SUMS, a CycloneDX SBOM and build provenance. Run it by hand (workflow_dispatch) to build and
# smoke-test every package without publishing: the packages are then only workflow artifacts.
# To complete a release whose build failed, run it by hand with the input `tag` (for example v0.5.0) from main: the
# packages are built from that tag's source with this workflow, and the publish job attaches them to that release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build from and publish to (for example v0.5.0); empty builds without publishing"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8
  # 0.5.10 is under the 7-day cooldown on 2026-11-16; Renovate moves this pin.
  CARGO_CYCLONEDX_VERSION: 0.5.9
  # SHA-256 of that release's x86_64-unknown-linux-gnu archive (the release's own .sha256 file); change it with the version.
  CARGO_CYCLONEDX_SHA256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # The release PR is authored with the estate release App token so CI runs on it; falls back to GITHUB_TOKEN.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # raul for macOS, one processor per runner in parallel (x86_64 cross-compiled on Apple silicon), each with its own
  # rust-cache; the macOS package job joins the two with lipo. Building both one after the other in the package job
  # took as long as the Windows package.
  macos-raul:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    name: raul for macOS (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          submodules: recursive
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos-${{ matrix.target }}

      - name: Version from the tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ -z "$version" ]; then version="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          perl -0pi -e "s/^version = \".*?\"$/version = \"$version\"/m" Cargo.toml crates/raul-gui/Cargo.toml
          cargo update --workspace
          # The GUI workspace's lock also names the umbrella crates it uses by path; resolving it again records their
          # new version without touching any other entry.
          cargo update --workspace --manifest-path crates/raul-gui/Cargo.toml
          cargo metadata --format-version 1 --manifest-path crates/raul-gui/Cargo.toml >/dev/null
          grep -m1 '^version' Cargo.toml crates/raul-gui/Cargo.toml

      # The engine's crates are linked into raul (feature `engine`, ADR-0016).
      - name: Build raul
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "$TARGET" >/dev/null
          cargo build --release --locked --manifest-path crates/raul-gui/Cargo.toml -p raul-gui --target "$TARGET" --features engine

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raul-macos-${{ matrix.target }}
          path: crates/raul-gui/target/${{ matrix.target }}/release/raul
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [release-please, macos-raul]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 is the glibc 2.35 baseline of ADR-0006.
          - name: linux-x64
            os: ubuntu-22.04
            formats: appimage,deb
          - name: windows-x64
            os: windows-latest
            formats: nsis
          - name: macos-universal
            os: macos-latest
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag input
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          submodules: recursive

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.name }}

      - name: Version from the tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ -z "$version" ]; then version="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          perl -0pi -e "s/^version = \".*?\"$/version = \"$version\"/m" Cargo.toml crates/raul-gui/Cargo.toml
          cargo update --workspace
          # The GUI workspace's lock also names the umbrella crates it uses by path; resolving it again records their
          # new version without touching any other entry.
          cargo update --workspace --manifest-path crates/raul-gui/Cargo.toml
          cargo metadata --format-version 1 --manifest-path crates/raul-gui/Cargo.toml >/dev/null
          grep -m1 '^version' Cargo.toml crates/raul-gui/Cargo.toml

      - name: Linux packaging tools
        if: ${{ runner.os == 'Linux' }}
        # libfuse2 and file for the AppImage; Xvfb and Mesa's software OpenGL for the window's smoke test.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2 file xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0

      # cargo-packager publishes no binary, so the one `cargo install` builds is cached by version and system.
      - name: Cache cargo-packager
        id: packager-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-packager${{ runner.os == 'Windows' && '.exe' || '' }}
          key: cargo-packager-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_PACKAGER_VERSION }}

      - name: Install cargo-packager
        if: ${{ steps.packager-cache.outputs.cache-hit != 'true' }}
        run: cargo install --locked cargo-packager --version "$CARGO_PACKAGER_VERSION"

      # macOS: the two halves the macos-raul jobs built, joined below.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ runner.os == 'macOS' }}
        with:
          pattern: raul-macos-*
          path: ${{ runner.temp }}/raul-halves

      - name: Build raul
        run: |
          set -euo pipefail
          mkdir -p target/bundle/components
          build() { # build <manifest> <package> <binary> <targets...>
            local manifest="$1" package="$2" bin="$3"; shift 3
            local outs=()
            for t in "$@"; do
              rustup target add "$t" >/dev/null
              cargo build --release --locked --manifest-path "$manifest" -p "$package" --target "$t" ${RAUL_BUILD_FEATURES:+--features "$RAUL_BUILD_FEATURES"}
              outs+=("$(dirname "$manifest")/target/$t/release/$bin")
            done
            if [ "$#" -gt 1 ]; then lipo -create -output "$OUT/$bin" "${outs[@]}"; else cp "${outs[0]}" "$OUT/$bin"; fi
          }
          case "$RUNNER_OS" in
            Linux) targets=(x86_64-unknown-linux-gnu); exe="" ;;
            Windows) targets=(x86_64-pc-windows-msvc); exe=".exe" ;;
            macOS) targets=(aarch64-apple-darwin x86_64-apple-darwin); exe="" ;;
          esac
          OUT=target/release; mkdir -p "$OUT"
          # The release raul is the GUI workspace's (ADR-0004): the same command line as raul-cli's, plus the window
          # it opens when started with no arguments. cargo-packager takes it from target/release.
          # The engine's crates are linked into raul (feature `engine`, ADR-0016) on every system, macOS's both processors
          # included. nv-rs builds its own Windows release with a static C runtime and the engine is built the same way
          # here, so it runs on the linkage it was tested with.
          if [ "$RUNNER_OS" = Windows ]; then export CARGO_ENCODED_RUSTFLAGS='-Ctarget-feature=+crt-static'; fi
          if [ "$RUNNER_OS" = macOS ]; then
            # Built by the macos-raul jobs, one per processor, in parallel.
            outs=()
            for t in "${targets[@]}"; do outs+=("$RUNNER_TEMP/raul-halves/raul-macos-$t/raul"); done
            lipo -create -output "$OUT/raul" "${outs[@]}"
            chmod 0755 "$OUT/raul"
          else
            RAUL_BUILD_FEATURES=engine build crates/raul-gui/Cargo.toml raul-gui "raul$exe" "${targets[@]}"
          fi
          unset CARGO_ENCODED_RUSTFLAGS
          # lodwright-rs and ttwright-rs are linked into raul (ADR-0016): no program of theirs is built or bundled.
          ls -l target/release/raul*

      - name: Third-party notices
        run: |
          set -euo pipefail
          {
            echo "# Third-party notices"
            echo
            echo "Raul's tRusty Toolbox is GPL-3.0-only. It includes the Components below, each under its own licence"
            echo "(see their repositories at the versions pinned as submodules): all are linked into raul. The Rust"
            echo "crates are listed after them. No game files are included."
            echo
            echo "| Component | Licence |"
            echo "| --- | --- |"
            echo "| nv-rs (fork of slaterain/nv-rs) | GPL-3.0-or-later |"
            echo "| nvmod | GPL-3.0-only |"
            echo "| loot-rs | GPL-3.0-only |"
            echo "| lodwright-rs | GPL-3.0-only |"
            echo "| ttwright-rs (rewrite of SulfurNitride/TTW_Linux_Installer) | GPL-3.0-only |"
            echo
            echo "| Crate | Version | Licence |"
            echo "| --- | --- | --- |"
            { cargo metadata --format-version 1 --locked
              cargo metadata --format-version 1 --locked --manifest-path crates/raul-gui/Cargo.toml
            } | jq -r '.packages[] | "| \(.name) | \(.version) | \(.license // "see source") |"' | sort -u
            echo
            echo "## Inter"
            echo
            echo "The interface typeface, Inter 4.1 (https://github.com/rsms/inter), is compiled into raul under the SIL Open"
            echo "Font License 1.1:"
            echo
            echo '```text'
            cat crates/raul-gui/assets/fonts/OFL.txt
            echo '```'
          } > target/bundle/THIRD-PARTY-NOTICES.md
          cp LICENSE target/bundle/LICENSE

      - name: macOS signing identity
        if: ${{ runner.os == 'macOS' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              printf '%s<<EOF\n%s\nEOF\n' "$v" "${!v}" >> "$GITHUB_ENV"
            done
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No Apple signing secrets: the macOS package is unsigned."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Package
        run: cargo packager --release -p raul-cli --formats "${{ matrix.formats }}"

      # cargo-packager names files after the product name, which has spaces and an apostrophe; GitHub rewrites
      # those in asset names, which would break `sha256sum -c SHA256SUMS` after download. Plain names instead.
      - name: Name the packages
        run: |
          set -euo pipefail
          cd target/packages
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              *-setup.exe) ext="setup.exe" ;;
              *.AppImage) ext="AppImage" ;;
              *.deb) ext="deb" ;;
              *.dmg) ext="dmg" ;;
              *) continue ;;
            esac
            mv -- "$f" "raul-$VERSION-${{ matrix.name }}.$ext"
          done
          ls -l

      - name: Portable archive
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/raul-$VERSION-${{ matrix.name }}"
          mkdir -p "$stage"
          cp -R target/bundle/. "$stage/"
          case "$RUNNER_OS" in
            Windows)
              cp target/release/raul.exe "$stage/" ;;
            *)
              cp target/release/raul "$stage/" ;;
          esac
          # The list of the unit's files, which raul checks an update against before it installs it (ADR-0020, #179).
          # Written after the last file is in place and before the archive is made.
          scripts/installed-files.sh generate "$stage"
          case "$RUNNER_OS" in
            Windows)
              (cd "$RUNNER_TEMP" && 7z a -tzip -bso0 "raul-$VERSION-${{ matrix.name }}-portable.zip" "raul-$VERSION-${{ matrix.name }}")
              mv "$RUNNER_TEMP/raul-$VERSION-${{ matrix.name }}-portable.zip" target/packages/ ;;
            *)
              tar -czf "target/packages/raul-$VERSION-${{ matrix.name }}.tar.gz" -C "$RUNNER_TEMP" "raul-$VERSION-${{ matrix.name }}" ;;
          esac
          find target/packages -maxdepth 1 -type f -print

      # Each artefact must start and report its version. On Linux the window must also open: `raul` with no
      # arguments under Xvfb, on Mesa's software OpenGL; RAUL_GUI_SMOKE closes it after its first frames.
      - name: Smoke test
        run: |
          set -euo pipefail
          # Git Bash on Windows has no /dev/stderr, so the output is captured and printed instead of tee'd.
          check() { local out; out="$("$@" --version)"; echo "$out"; head -1 <<<"$out" | grep -qx "raul $VERSION"; }
          window() {
            local out; out="$(RAUL_GUI_SMOKE=1 LIBGL_ALWAYS_SOFTWARE=1 timeout 120 xvfb-run -a "$@")"; echo "$out"
            [ "$out" = "raul: the window opened and closed" ]
          }
          # The Components are linked into raul (ADR-0016), the engine included: no package may hold a program of theirs,
          # an engine viewer, or an engine folder (the game starts as raul's own play mode).
          no_component_programs() {
            local found
            found="$(find "$@" \( -type f \( -iname 'lodwright*' -o -iname 'ttwright*' -o -iname 'nv-viewer*' \) -o -path '*components/nv-rs' \))"
            if [ -n "$found" ]; then echo "::error::Component programs or an engine in the package:"; echo "$found"; return 1; fi
          }
          case "$RUNNER_OS" in
            Linux)
              app="$(realpath target/packages/*.AppImage)"; chmod +x "$app"
              check "$app" --appimage-extract-and-run
              window "$app" --appimage-extract-and-run
              (cd "$RUNNER_TEMP" && "$app" --appimage-extract >/dev/null)
              dpkg-deb -x target/packages/*.deb "$RUNNER_TEMP/deb" && check "$RUNNER_TEMP/deb/usr/bin/raul"
              window "$RUNNER_TEMP/deb/usr/bin/raul"
              tar -xzf target/packages/*.tar.gz -C "$RUNNER_TEMP" && check "$RUNNER_TEMP/raul-$VERSION-linux-x64/raul"
              scripts/installed-files.sh check "$RUNNER_TEMP/raul-$VERSION-linux-x64"
              window "$RUNNER_TEMP/raul-$VERSION-linux-x64/raul"
              grep -q "SIL Open Font License" "$RUNNER_TEMP/raul-$VERSION-linux-x64/THIRD-PARTY-NOTICES.md"
              no_component_programs "$RUNNER_TEMP/squashfs-root" "$RUNNER_TEMP/deb" "$RUNNER_TEMP/raul-$VERSION-linux-x64"
              ;;
            Windows)
              7z x -bso0 -o"$RUNNER_TEMP/zip" target/packages/*-portable.zip
              check "$RUNNER_TEMP/zip/raul-$VERSION-windows-x64/raul.exe"
              scripts/installed-files.sh check "$RUNNER_TEMP/zip/raul-$VERSION-windows-x64"
              no_component_programs "$RUNNER_TEMP/zip"
              setup="$(ls target/packages/*.setup.exe)"
              # The installer must hold the same raul.exe: 7z unpacks an NSIS installer without running it.
              7z x -bso0 -o"$RUNNER_TEMP/nsis" "$setup"; check "$(find "$RUNNER_TEMP/nsis" -iname raul.exe -print -quit)"
              no_component_programs "$RUNNER_TEMP/nsis"
              # A silent install is tried under a time limit; it hung in CI before (#108): Git Bash rewrote /S into S:/, so
              # the installer opened its window and waited. MSYS_NO_PATHCONV keeps the argument. A hang is a warning.
              if MSYS_NO_PATHCONV=1 timeout 180 "$setup" /S /D="$(cygpath -w "$RUNNER_TEMP/installed")"; then
                sleep 5; check "$RUNNER_TEMP/installed/raul.exe"
              else
                echo "::warning::the silent NSIS install did not finish within 180 s (exit $?); the installer contents were checked above"
                taskkill //F //IM "$(basename "$setup")" >/dev/null 2>&1 || true
              fi ;;
            macOS)
              # The dmg shows the licence as an agreement; `yes` accepts it so attach does not wait.
              # `yes` is fed through process substitution: it ends with a broken pipe when hdiutil stops reading,
              # which in a pipeline would fail the step under pipefail.
              dmg="$(ls target/packages/*.dmg)"; env PAGER=cat hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" "$dmg" < <(yes) >/dev/null
              check "$RUNNER_TEMP/dmg/Raul's tRusty Toolbox.app/Contents/MacOS/raul"
              archs="$(lipo -archs "$RUNNER_TEMP/dmg/Raul's tRusty Toolbox.app/Contents/MacOS/raul")"; echo "$archs"
              grep -qw arm64 <<<"$archs"; grep -qw x86_64 <<<"$archs"
              no_component_programs "$RUNNER_TEMP/dmg"
              mkdir -p "$RUNNER_TEMP/mac" && tar -xzf target/packages/*.tar.gz -C "$RUNNER_TEMP/mac"
              scripts/installed-files.sh check "$RUNNER_TEMP/mac/raul-$VERSION-${{ matrix.name }}"
              no_component_programs "$RUNNER_TEMP/mac"
              hdiutil detach "$RUNNER_TEMP/dmg" ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.name }}
          path: |
            target/packages/*.AppImage
            target/packages/*.deb
            target/packages/*.tar.gz
            target/packages/*.setup.exe
            target/packages/*-portable.zip
            target/packages/*.dmg
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          submodules: recursive

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Version from the tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ -z "$version" ]; then version="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          perl -0pi -e "s/^version = \".*?\"$/version = \"$version\"/m" Cargo.toml
          cargo update --workspace

      - name: SBOM
        run: |
          set -euo pipefail
          # The project's own prebuilt binary, pinned by version and SHA-256, instead of a build from source (about 2.5 minutes).
          archive="cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CARGO_CYCLONEDX_VERSION}/$archive"
          echo "$CARGO_CYCLONEDX_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cyclonedx"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/cyclonedx" --strip-components=1
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "$RUNNER_TEMP/cyclonedx/cargo-cyclonedx" "$HOME/.cargo/bin/cargo-cyclonedx"
          cargo cyclonedx --format json --spec-version 1.5 --manifest-path crates/raul-cli/Cargo.toml
          cp crates/raul-cli/raul-cli.cdx.json dist/raul.cdx.json

      - name: Checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to the release
        if: ${{ env.TAG != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          if [ -n "$APPLE_CERTIFICATE" ]; then mac="signed and notarised"; else mac="**unsigned**: macOS will ask you to allow it in System Settings, Privacy & Security"; fi
          notes="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          {
            printf '%s\n\n' "$notes"
            scripts/release-contents.sh dist/SHA256SUMS
            echo
            echo "## Signing"
            echo
            echo "- Windows: **unsigned**. SmartScreen may warn; choose More info, Run anyway."
            echo "- macOS: $mac."
            echo "- Linux: AppImage and .deb are not signed; verify with SHA256SUMS and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo
            echo "Source of every GPL Component at these versions: see the submodules (components/) at $TAG."
            echo "You need your own copy of Fallout: New Vegas; no game files are included."
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
