# The public site (https://jorisjonkers-dev.github.io/rauls-trusty-toolbox/): a landing page, the clickable demo at
# /demo/, the guided tour at /tour/ and the wiki at /wiki/ (docs/wiki, Markdown). `site/build.py` builds it and
# `site/check.js` checks it: every internal link resolves, no page logs an error and every tour step ticks.
#
# Pages is served from the gh-pages branch, which the bench workflow also writes (bench/). This workflow only replaces
# its own paths there (index.html, demo/, tour/, wiki/, assets/) and leaves bench/ and README.md alone. Both writers
# share the concurrency group `gh-pages-publish`, so two pushes to the branch never run at the same time.
#
# A pull request builds and checks the site and publishes nothing.
name: Pages

on:
  pull_request:
    paths:
      - "docs/design/demo/**"
      - "docs/design/screenshots/**"
      - "docs/wiki/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/design/demo/**"
      - "docs/design/screenshots/**"
      - "docs/wiki/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the site
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r site/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" site/build.py --out "$RUNNER_TEMP/site"
      - name: Check the site
        env:
          PW_CHANNEL: chrome
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          node site/check.js "$RUNNER_TEMP/site"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          if-no-files-found: error

  publish:
    # Only main publishes, so a dispatch from a feature branch cannot replace the public site.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
      - name: Replace the site's own paths
        working-directory: pages
        run: |
          for dir in demo tour wiki assets; do
            mkdir -p "$dir"
            rsync -a --delete "../site/$dir/" "$dir/"
          done
          cp ../site/index.html ../site/.nojekyll .
          git add index.html .nojekyll demo tour wiki assets
          if git diff --cached --quiet; then
            echo "The site is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(site): publish the site from ${GITHUB_SHA::7}"
          for _ in 1 2 3; do
            git push origin HEAD:gh-pages && exit 0
            git pull --rebase origin gh-pages
          done
          echo "Could not push to gh-pages." >&2
          exit 1
