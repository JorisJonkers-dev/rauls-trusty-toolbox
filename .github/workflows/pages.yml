# The public site (https://jorisjonkers-dev.github.io/rauls-trusty-toolbox/): a landing page, the clickable demo at
# /demo/, the guided tour at /tour/, the download page at /download/ and the wiki at /wiki/ (docs/wiki, Markdown). `site/build.py` builds it and
# `site/check.js` checks it: every internal link resolves, no page logs an error and every tour step ticks.
#
# Pages is served from the gh-pages branch, which the bench workflow also writes (bench/raw/ and bench/results/). This workflow only replaces
# its own paths there (index.html, demo/, tour/, wiki/, download/, assets/, and the pages of bench/) and leaves bench/raw/, bench/results/ and README.md alone. The bench
# history job is not touched and keeps its own behaviour, so no bench data point can be dropped; this job has its own
# queue (publishes never cancel each other) and, if the branch moved while it ran, rebases onto it and pushes again.
# The two writers change different paths, so the rebase has nothing to resolve.
#
# A pull request builds and checks the site and publishes nothing.
name: Pages

on:
  pull_request:
    paths:
      - "docs/design/demo/**"
      - "docs/design/screenshots/**"
      - "docs/wiki/**"
      - "site/**"
      - "docs/bench/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/design/demo/**"
      - "docs/design/screenshots/**"
      - "docs/wiki/**"
      - "site/**"
      - "docs/bench/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the benchmark records (gh-pages)
        # The history and the records component CI publishes live on gh-pages; the site is built with them.
        run: git clone --depth 1 --branch gh-pages --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/gh-pages" || mkdir -p "$RUNNER_TEMP/gh-pages"
      - name: Build the site
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r site/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" site/build.py --out "$RUNNER_TEMP/site" --gh-pages "$RUNNER_TEMP/gh-pages"
      - name: Check the site
        env:
          PW_CHANNEL: chrome
        run: |
          npm ci --prefix site --ignore-scripts
          node site/check.js "$RUNNER_TEMP/site"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          if-no-files-found: error

  publish:
    # Only main publishes, so a dispatch from a feature branch cannot replace the public site.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
      # the publish scripts live in the repository's site/ (and read the app's icons from docs/design/demo/src), which
      # the built artifact above does not carry
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: |
            site
            docs/design/demo/src
          persist-credentials: false
      - name: Replace the site's own paths
        working-directory: pages
        run: |
          sh ../src/site/bench-migrate.sh "$PWD"
          # the chart page the bench workflow writes gets the navbar too
          python3 ../src/site/bench_raw.py bench
          for dir in demo tour wiki download assets; do
            mkdir -p "$dir"
            rsync -a --delete "../site/$dir/" "$dir/"
          done
          # bench/: the pages only; raw/ (github-action-benchmark) and results/ (records) belong to the bench workflow
          mkdir -p bench
          rsync -a --delete --exclude raw --exclude results ../site/bench/ bench/
          cp ../site/index.html ../site/404.html ../site/.nojekyll .
          git add index.html 404.html .nojekyll demo tour wiki download assets bench
          if git diff --cached --quiet; then
            echo "The site is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(site): publish the site from ${GITHUB_SHA::7}"
          for _ in 1 2 3 4 5; do
            git push origin HEAD:gh-pages && exit 0
            git pull --rebase origin gh-pages
          done
          echo "Could not push to gh-pages." >&2
          exit 1
