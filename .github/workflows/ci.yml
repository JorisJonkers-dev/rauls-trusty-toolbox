# One pipeline ending in "Pipeline Complete", the only required check (estate convention, repo-template ci.yml).
#
# Pipeline Complete runs every Linux check as steps of one job. The Windows and macOS (macos-latest, arm64) builds and the
# quarantine check cannot be steps of a Linux job, so they are jobs that its last step gates on; the required check
# keeps its name when jobs change. Each step carries `if: !cancelled()` so one failure still shows the rest.
#
# Pull-request time: the umbrella workspace builds nvmod and loot-rs but never nv-rs (ADR-0002), which keeps a warm
# run well under ten minutes. nv-rs is built only in the release workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new commit on a branch cancels the older run; main is never cancelled, so every main commit has a finished run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # A skipped test whose quarantine ran out, names no issue, or lasts over 14 days fails the build
  # (workspace docs/testing-standards.md, section 7).
  quarantine:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/quarantine-check.yml@b14d5e031f1abd5bec45e50c898e9e73f3ffc534 # v0.50.4

  platforms:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            crates/raul-gui -> target
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Fetch Component tags
        shell: bash
        run: git submodule foreach --quiet 'git fetch --quiet --tags --depth=1 origin'
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: mise exec -- cargo nextest run --workspace --locked
      - name: Doc tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --locked
      # The GUI workspace (crates/raul-gui) has its own lock file, so the steps above never see it; gui.yml runs it
      # on Linux only and only when its paths change. Built and tested here on every pull request.
      - name: GUI workspace lint
        if: ${{ !cancelled() }}
        working-directory: crates/raul-gui
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: GUI workspace tests
        if: ${{ !cancelled() }}
        working-directory: crates/raul-gui
        run: mise exec -- cargo nextest run --workspace --locked

  pipeline-complete:
    name: Pipeline Complete
    needs: [quarantine, platforms]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Submodules on a tag or their default branch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-submodules.sh

      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The tests run once, instrumented; the report feeds the changed-line gate below.
      - name: Tests with coverage
        id: tests
        if: ${{ !cancelled() }}
        run: mise exec -- cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info

      # 70% of the executable lines a change adds or edits in the Toolbox's crates must run in a test
      # (docs/COVERAGE.md). Submodule moves change no line here, so a Component bump has nothing to gate.
      - name: Changed-line coverage gate (70%)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with: nothing to gate." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo test --locked --manifest-path tools/coverage-gate/Cargo.toml
          cargo run --quiet --locked --manifest-path tools/coverage-gate/Cargo.toml -- \
            --lcov lcov.info --base "$BASE" --min 70 --summary "$GITHUB_STEP_SUMMARY"

      - name: Doc tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --locked

      # rust-version equals the pinned toolchain (1.100), so building with rust-toolchain.toml is the MSRV check;
      # this step fails if a crate of this workspace declares a different one.
      - name: MSRV
        if: ${{ !cancelled() }}
        run: |
          test "$(cargo metadata --format-version 1 --no-deps | jq -r '[.packages[].rust_version] | unique | join(",")')" = "1.100"

      - name: Licences, bans, sources and advisories
        if: ${{ !cancelled() }}
        run: mise exec -- cargo deny --locked check

      - name: GPL-3.0-or-later only under components/nv-rs
        if: ${{ !cancelled() }}
        run: |
          scripts/check-gpl-scope.sh --self-test
          scripts/check-gpl-scope.sh

      - name: Public text does not name the private workshop
        if: ${{ !cancelled() }}
        run: |
          scripts/check-public-text.sh --self-test
          scripts/check-public-text.sh

      - name: Release notes contents
        if: ${{ !cancelled() }}
        run: scripts/release-contents.sh --self-test

      - name: Installed files list
        if: ${{ !cancelled() }}
        run: scripts/installed-files.sh --self-test

      - name: Advisories (cargo audit)
        if: ${{ !cancelled() }}
        run: mise exec -- cargo audit

      - name: Lint GitHub Actions workflows
        if: ${{ !cancelled() }}
        run: mise exec -- actionlint -color .github/workflows/*.yml

      - name: Gated jobs passed
        if: ${{ !cancelled() }}
        env:
          QUARANTINE: ${{ needs.quarantine.result }}
          PLATFORMS: ${{ needs.platforms.result }}
        run: |
          test "$QUARANTINE" = success
          test "$PLATFORMS" = success
