# One pipeline ending in "Pipeline Complete", the only required check (estate convention, repo-template ci.yml).
#
# The checks run as parallel jobs and Pipeline Complete only gates on them (repo-template option 2, alls-green): it
# fails unless every job it needs passed, or was skipped on purpose. This repository is public, so standard runners
# are not billed and the per-job minute rounding the estate default avoids costs nothing here; wall-clock does.
#
#   changes ─┬─ lint ────────────┐
#            ├─ test-linux ──────┤
#            ├─ platforms (4) ───┼─ catalogue ─┐
#            └─ gui (2) ─────────┘             ├─ Pipeline Complete ─ reports (main only)
#   policy, quarantine ────────────────────────┘
#
# A pull request builds and tests only what it changes and what depends on it (scripts/ci/changes.sh: changed files ->
# crates -> reverse dependents from `cargo metadata`, in both workspaces; a Component bump -> its dependents). Windows
# and macOS join a pull request only for platform-specific changes or with the `ci:all-os` label (add it, then re-run
# the workflow). A documentation or site only pull request builds nothing. A push to main always runs everything on
# all three systems, so its feature-catalogue reports carry the results of all of them (a nightly full run would
# leave main without them for up to a day: the catalogue ratchet needs the JUnit files of every system).
#
# Pull-request time: the umbrella workspace builds nvmod and loot-rs but never nv-rs (ADR-0002); nv-rs is built only
# in the release workflow. Rust caches are saved on main only (.github/actions/rust-setup).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new commit on a branch cancels the older run; main is never cancelled, so every main commit has a finished run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  # The pinned tally release (https://github.com/JorisJonkers-dev/tally) and the SHA-256 of its Linux binary, from
  # that release's SHA256SUMS. Bump it with `tally ids --generator catalogue/tally_ids_gen.rs`.
  TALLY_VERSION: v0.8.0
  TALLY_SHA256: 5dc487d3f84248e5a80a06f989acb31b3040ee77342656971437f76493e925e6
  # The generated feature-catalogue reports: the only files the `reports` job may commit on main.
  REPORT_FILES: >-
    docs/coverage/FEATURES.md
    docs/coverage/tally-report.json
    docs/coverage/tally.svg

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      umbrella: ${{ steps.diff.outputs.umbrella }}
      umbrella_args: ${{ steps.diff.outputs.umbrella_args }}
      gui: ${{ steps.diff.outputs.gui }}
      gui_args: ${{ steps.diff.outputs.gui_args }}
      platforms: ${{ steps.diff.outputs.platforms }}
      allowed_skips: ${{ steps.diff.outputs.allowed_skips }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `cargo metadata` reads the Components' manifests (path dependencies); no history of theirs is needed.
      - name: Components (manifests only)
        run: git submodule update --init --depth 1
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          # Reading the dependency graph needs no pinned compiler; the preinstalled one avoids a download here.
          RUSTUP_TOOLCHAIN: stable
        run: scripts/ci/changes.sh

  # A skipped test whose quarantine ran out, names no issue, or lasts over 14 days fails the build
  # (workspace docs/testing-standards.md, section 7).
  quarantine:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/quarantine-check.yml@b14d5e031f1abd5bec45e50c898e9e73f3ffc534 # v0.50.4

  # Checks that build nothing: repository policy, dependencies and workflow lint. Always run, documentation or not.
  policy:
    name: Policy and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true

      - name: Submodules on a tag or their default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-submodules.sh

      # rust-version equals the pinned toolchain (1.100), so building with rust-toolchain.toml is the MSRV check;
      # this step fails if a crate of this workspace declares a different one.
      - name: MSRV
        if: ${{ !cancelled() }}
        run: |
          test "$(cargo metadata --format-version 1 --no-deps | jq -r '[.packages[].rust_version] | unique | join(",")')" = "1.100"

      - name: Licences, bans, sources and advisories
        if: ${{ !cancelled() }}
        run: mise exec -- cargo deny --locked check

      - name: Advisories (cargo audit)
        if: ${{ !cancelled() }}
        run: mise exec -- cargo audit

      - name: GPL-3.0-or-later only under components/nv-rs
        if: ${{ !cancelled() }}
        run: |
          scripts/check-gpl-scope.sh --self-test
          scripts/check-gpl-scope.sh

      - name: Public text does not name the private workshop
        if: ${{ !cancelled() }}
        run: |
          scripts/check-public-text.sh --self-test
          scripts/check-public-text.sh

      - name: Script self-tests
        if: ${{ !cancelled() }}
        run: |
          scripts/release-contents.sh --self-test
          scripts/check-release-assets.sh --self-test
          scripts/installed-files.sh --self-test
          scripts/ci/changes.sh --self-test

      - name: Lint GitHub Actions workflows
        if: ${{ !cancelled() }}
        run: mise exec -- actionlint -color .github/workflows/*.yml

  # Format, lint and doc tests of the umbrella workspace on Linux; no instrumented build, so it shares nothing with
  # test-linux and runs beside it.
  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.umbrella == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        if: ${{ !cancelled() }}
        env:
          SELECT: ${{ needs.changes.outputs.umbrella_args }}
        run: |
          # shellcheck disable=SC2086
          cargo clippy $SELECT --all-targets --locked -- -D warnings
      - name: Doc tests
        if: ${{ !cancelled() }}
        env:
          SELECT: ${{ needs.changes.outputs.umbrella_args }}
        run: |
          # shellcheck disable=SC2086
          cargo test $SELECT --doc --locked
      - name: Coverage gate tool tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --manifest-path tools/coverage-gate/Cargo.toml

  # The umbrella workspace's tests run once, instrumented; the report feeds the changed-line gate (docs/COVERAGE.md).
  test-linux:
    name: Build and test (ubuntu-latest)
    needs: changes
    if: ${{ needs.changes.outputs.umbrella == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Tests with coverage
        id: tests
        env:
          # The ci profile of .config/nextest.toml: no retries and a JUnit file for the feature catalogue.
          NEXTEST_PROFILE: ci
          SELECT: ${{ needs.changes.outputs.umbrella_args }}
        run: |
          # shellcheck disable=SC2086
          mise exec -- cargo llvm-cov nextest $SELECT --locked --lcov --output-path lcov.info
      - name: Keep the JUnit results
        if: ${{ !cancelled() }}
        run: scripts/ci/keep-junit.sh junit-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: junit-linux
          path: ${{ runner.temp }}/junit/junit-linux.xml
          if-no-files-found: warn
          retention-days: 7
      # 70% of the executable lines a change adds or edits in the Toolbox's crates must run in a test. Submodule moves
      # change no line here, so a Component bump has nothing to gate.
      - name: Changed-line coverage gate (70%)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci/coverage-gate.sh lcov.info

  # Windows and macOS (macos-latest, arm64), one job per workspace so the GUI workspace (crates/raul-gui, its own lock
  # file) builds beside the umbrella one instead of after it. The legs come from `changes`: all of them on a push to
  # main, only the affected workspaces and crates on a pull request that is platform-specific or labelled `ci:all-os`,
  # none otherwise.
  platforms:
    name: Build and test (${{ matrix.os }}, ${{ matrix.workspace }})
    needs: changes
    if: ${{ needs.changes.outputs.platforms != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.dir }}
    env:
      JUNIT_NAME: junit-${{ startsWith(matrix.os, 'windows') && 'windows' || 'macos' }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          workspaces: ${{ matrix.dir }} -> target
          key: ${{ matrix.workspace }}
      - name: Fetch Component tags
        run: git submodule foreach --quiet 'git fetch --quiet --tags --depth=1 origin'
      - name: Lint
        if: ${{ !cancelled() }}
        env:
          SELECT: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086
          cargo clippy $SELECT --all-targets --locked -- -D warnings
      # Through the ci profile (.config/nextest.toml), so the run leaves JUnit for the feature catalogue.
      - name: Test
        if: ${{ !cancelled() }}
        env:
          SELECT: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086
          mise exec -- cargo nextest run $SELECT --locked --profile ci
      - name: Doc tests
        if: ${{ !cancelled() && matrix.workspace == 'umbrella' }}
        env:
          SELECT: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086
          cargo test $SELECT --doc --locked
      - name: Keep the JUnit results
        if: ${{ !cancelled() }}
        run: ${{ matrix.root }}/scripts/ci/keep-junit.sh "$JUNIT_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.JUNIT_NAME }}
          path: ${{ runner.temp }}/junit/${{ env.JUNIT_NAME }}.xml
          if-no-files-found: ignore
          retention-days: 3
      # The start of the window that gui.yml makes on Linux (#69): `raul` with no arguments opens it and RAUL_GUI_SMOKE closes it
      # after its first frames. A hosted Windows runner has no GPU and only the generic OpenGL 1.1 of the system, which the
      # toolkit refuses ("requires opengl 2.0+"): that one answer is a reported skip with its reason, anything else fails.
      - name: Start the GUI and close it again
        if: ${{ !cancelled() && matrix.workspace == 'gui' }}
        timeout-minutes: 5
        env:
          RAUL_GUI_SMOKE: "1"
        run: |
          set -uo pipefail
          cargo build --locked --bin raul
          code=0
          out=$(target/debug/raul 2>&1) || code=$?
          echo "$out"
          echo "exit code: $code"
          if [ "$code" -eq 0 ] && [ "$out" = "raul: the window opened and closed" ]; then exit 0; fi
          if [[ "$out" == *"requires opengl 2.0"* ]]; then
            echo "::warning title=GUI start skipped::this runner offers no OpenGL 2.0 (hosted ${{ matrix.os }}): the window was not opened here; Linux (gui.yml) opens it on Mesa"
            echo "GUI start skipped on ${{ matrix.os }}: no OpenGL 2.0 on the runner." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1

  # The GUI workspace on Linux (crates/raul-gui, its own lock file): a reusable workflow with its lint and test jobs.
  gui:
    needs: changes
    if: ${{ needs.changes.outputs.gui == 'true' }}
    uses: ./.github/workflows/gui.yml
    with:
      args: ${{ needs.changes.outputs.gui_args }}

  # The feature catalogue (scripts/ci/feature-catalogue.sh, docs/COVERAGE.md). On a pull request it checks the
  # catalogue; on main it needs the JUnit results of every test job and renders the reports for the `reports` job.
  catalogue:
    name: Feature catalogue
    needs: [test-linux, platforms, gui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      reports: ${{ steps.catalogue.outputs.reports }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A missing file (a job that did not finish, or a documentation-only pull request) is handled by the script.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: junit-*
          merge-multiple: true
          path: ${{ runner.temp }}/junit
      - name: Feature catalogue (tally)
        id: catalogue
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          JUNIT: ${{ runner.temp }}/junit
        run: scripts/ci/feature-catalogue.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.catalogue.outputs.reports == 'changed' }}
        with:
          name: report-files
          path: ${{ runner.temp }}/render/docs/coverage/
          retention-days: 3

  # The required check. It runs no check itself: it fails unless every job above passed. Only the jobs that `changes`
  # decided not to run (nothing affected them, or Windows and macOS were not asked for) may be skipped; if `changes`
  # itself fails, the list is empty and every skip fails the check.
  pipeline-complete:
    name: Pipeline Complete
    needs: [changes, quarantine, policy, lint, test-linux, platforms, gui, catalogue]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: ${{ needs.changes.outputs.allowed_skips }}
          jobs: ${{ toJSON(needs) }}

  reports:
    name: Catalogue reports
    needs: [pipeline-complete, catalogue]
    # Explicit result check: the implicit success() is false when an upstream job was skipped.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.pipeline-complete.result == 'success' && needs.catalogue.outputs.reports == 'changed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HAS_APP: ${{ vars.PROGRESS_APP_ID != '' && secrets.PROGRESS_APP_PRIVATE_KEY != '' }}
    steps:
      - name: No App to push with
        if: ${{ env.HAS_APP != 'true' }}
        run: echo "::warning title=Catalogue reports::the reports changed, but PROGRESS_APP_ID or PROGRESS_APP_PRIVATE_KEY is not set; nothing pushed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.HAS_APP == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ env.HAS_APP == 'true' }}
        with:
          name: report-files
          path: ${{ runner.temp }}/report-files
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ env.HAS_APP == 'true' }}
        with:
          app-id: ${{ vars.PROGRESS_APP_ID }}
          private-key: ${{ secrets.PROGRESS_APP_PRIVATE_KEY }}
          permission-contents: write
      # The commit is made on the commit that was tested. If main moved on meanwhile, the newer push's run commits.
      - name: Commit and push
        if: ${{ env.HAS_APP == 'true' }}
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/coverage
          for f in $REPORT_FILES; do
            cp "$RUNNER_TEMP/report-files/$(basename "$f")" "$f"
          done
          git=(git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com")
          # shellcheck disable=SC2086
          "${git[@]}" add -- $REPORT_FILES
          if "${git[@]}" diff --cached --quiet; then
            echo "Nothing to commit." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "${git[@]}" commit --quiet -m "chore(catalogue): update the generated reports [skip ci]"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          head="$("${git[@]}" ls-remote "$remote" refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice title=Catalogue reports::main moved on ($head); the newer run commits"
            exit 0
          fi
          "${git[@]}" push --quiet "$remote" HEAD:refs/heads/main
          echo "Pushed $(git rev-parse --short HEAD)." >>"$GITHUB_STEP_SUMMARY"
